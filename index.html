// ---------- Wczytywanie plików ----------
// ---------- Pamięć podręczna sparsowanych danych (IndexedDB) ----------
// Parsowanie dużego eksportu trwa kilkanaście sekund, a wynik zależy wyłącznie od zawartości
// plików — trzymamy go więc pod kluczem z nazw, rozmiarów i dat modyfikacji. Klucz jest per
// ZESTAW plików, a nie jeden globalny: strona ma działać dla dowolnego eksportu, więc dwa różne
// pliki muszą mieć dwa różne wpisy, a podmieniony plik nie może trafić na cudzy wynik.
const CACHE_DB = 'timeline-heatmap', CACHE_STORE = 'parsed';
const CACHE_KEEP = 3;        // ile zestawów trzymamy; nadmiar kasujemy od najstarszego

function cacheKey(files){
  return files.map(f => `${f.name}|${f.size}|${f.lastModified}`).sort().join('&');
}
function idbOpen(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(CACHE_DB, 2);
    r.onupgradeneeded = () => {
      const db = r.result;
      const st = db.objectStoreNames.contains(CACHE_STORE)
        ? r.transaction.objectStore(CACHE_STORE)
        : db.createObjectStore(CACHE_STORE, { keyPath:'key' });
      if (!st.indexNames.contains('savedAt')) st.createIndex('savedAt', 'savedAt');
      // Klucz indeksu to sam rozmiar wpisu, więc da się go zsumować kursorem po kluczach,
      // bez wczytywania wielkich tablic z danymi.
      if (!st.indexNames.contains('bytes')) st.createIndex('bytes', 'bytes');
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function idbRun(db, mode, fn){
  return new Promise((res, rej) => {
    const tx = db.transaction(CACHE_STORE, mode);
    const req = fn(tx.objectStore(CACHE_STORE));
    let out;
    if (req) req.onsuccess = () => { out = req.result; };
    tx.oncomplete = () => res(out);
    tx.onerror = tx.onabort = () => rej(tx.error);
  });
}

// Zamiast 31 tys. drobnych obiektów zapisujemy kilka płaskich tablic typowanych — IndexedDB
// klonuje je jednym ciągiem zamiast element po elemencie, więc i zapis, i odczyt są dużo tańsze.
// Tym samym formatem wątek roboczy oddaje wynik parsowania (przenoszony bez kopiowania).
/*<<CORE*/
const CACHE_SCHEMA = 3;      // podbić przy każdej zmianie kształtu segmentów; 3: formats trzyma klucze
const VISIT_TYPES = ['home','work','other'];
function packData(){
  const n = SEGMENTS.length, mIdx = new Map(MODES.map((m,i) => [m.k, i]));
  const unk = mIdx.get('unknown');
  let np = 0, nh = 0;
  for (const s of SEGMENTS){ np += s.c.length; nh += s.hull.length * 2; }
  const coords = new Float32Array(np), cOff = new Uint32Array(n+1);
  const hull   = new Float32Array(nh), hOff = new Uint32Array(n+1);
  // Współrzędne mogą być Float32 (tak trzyma je parser), ale bbox i długość trasy powstają
  // w parserze jako liczby podwójnej precyzji — w Float32 cache przestałby być
  // nieodróżnialny od świeżego parsowania. Float64 kosztuje tu ~0,6 MB i tyle.
  const bbox = new Float64Array(n*4), times = new Float64Array(n*2);   // Float64 trzyma też NaN
  const gd = new Float64Array(n), modes = new Uint8Array(n);
  let ci = 0, hi = 0;
  for (let i=0;i<n;i++){
    const s = SEGMENTS[i];
    cOff[i] = ci; coords.set(s.c, ci); ci += s.c.length;
    hOff[i] = hi; for (const p of s.hull){ hull[hi++] = p[0]; hull[hi++] = p[1]; }
    bbox.set(s.b, i*4);
    times[i*2] = s.t; times[i*2+1] = s.te;
    gd[i] = s.gd;
    modes[i] = mIdx.has(s.mode) ? mIdx.get(s.mode) : unk;
  }
  cOff[n] = ci; hOff[n] = hi;

  const an = ACTIVITIES.length;
  const aTimes = new Float64Array(an*2), aDist = new Float64Array(an), aMode = new Uint8Array(an);
  for (let i=0;i<an;i++){
    const a = ACTIVITIES[i];
    aTimes[i*2] = a.t; aTimes[i*2+1] = a.te; aDist[i] = a.dist;
    aMode[i] = mIdx.has(a.mode) ? mIdx.get(a.mode) : unk;
  }
  const vn = VISITS.length;
  const vTimes = new Float64Array(vn), vType = new Uint8Array(vn);
  for (let i=0;i<vn;i++){
    vTimes[i] = VISITS[i].t;
    const k = VISIT_TYPES.indexOf(VISITS[i].type);
    vType[i] = k < 0 ? VISIT_TYPES.indexOf('other') : k;
  }
  return { schema:CACHE_SCHEMA, n, coords, cOff, hull, hOff, bbox, times, gd, modes,
           aTimes, aDist, aMode, vTimes, vType,
           totalPts:TOTAL_PTS, files:FILES, formats:[...FORMATS], dataMin:DATA_MIN, dataMax:DATA_MAX };
}
// bufory do przeniesienia bez kopiowania przy wysyłce z wątku roboczego
function packBuffers(p){
  const b = [];
  for (const v of Object.values(p)) if (ArrayBuffer.isView(v)) b.push(v.buffer);
  return b;
}
/*CORE>>*/
function unpackData(r){
  const n = r.n, MK = MODES.map(m => m.k);
  SEGMENTS = new Array(n);
  for (let i=0;i<n;i++){
    const hs = r.hOff[i], he = r.hOff[i+1], hull = new Array((he-hs)/2);
    for (let j=hs, k=0; j<he; j+=2, k++) hull[k] = [r.hull[j], r.hull[j+1]];
    SEGMENTS[i] = {
      c: r.coords.subarray(r.cOff[i], r.cOff[i+1]),      // widok na wspólny bufor, bez kopiowania
      b: [r.bbox[i*4], r.bbox[i*4+1], r.bbox[i*4+2], r.bbox[i*4+3]],
      t: r.times[i*2], te: r.times[i*2+1],
      mode: MK[r.modes[i]] || 'unknown', gd: r.gd[i], hull
    };
  }
  ACTIVITIES = new Array(r.aMode.length);
  for (let i=0;i<ACTIVITIES.length;i++)
    ACTIVITIES[i] = { t:r.aTimes[i*2], te:r.aTimes[i*2+1], mode:MK[r.aMode[i]]||'unknown', dist:r.aDist[i] };
  VISITS = new Array(r.vType.length);
  for (let i=0;i<VISITS.length;i++)
    VISITS[i] = { t:r.vTimes[i], type: VISIT_TYPES[r.vType[i]] || 'other' };
  PATHREFS = [];
  TOTAL_PTS = r.totalPts; FILES = r.files;
  FORMATS.clear(); for (const f of r.formats) FORMATS.add(f);
  DATA_MIN = r.dataMin; DATA_MAX = r.dataMax;
}

async function cacheLoad(key){
  if (!(await cacheExists())) return null;      // nie zakładaj bazy tylko po to, żeby nic nie znaleźć
  const db = await idbOpen();
  try {
    const rec = await idbRun(db, 'readonly', st => st.get(key));
    return rec && rec.schema === CACHE_SCHEMA ? rec : null;   // starszy układ danych ignorujemy
  } finally { db.close(); }
}
async function cacheSave(key){
  if (!window.indexedDB) return;
  const db = await idbOpen();
  try {
    const rec = packData();
    rec.key = key; rec.savedAt = Date.now();
    let bytes = 0;
    for (const v of Object.values(rec)) if (ArrayBuffer.isView(v)) bytes += v.byteLength;
    rec.bytes = bytes;
    await idbRun(db, 'readwrite', st => st.put(rec));
    // kasuj najstarsze ponad limit — po kluczach z indeksu, żeby nie wczytywać wielkich wartości
    const byAge = await new Promise((res, rej) => {
      const tx = db.transaction(CACHE_STORE, 'readonly'), out = [];
      tx.objectStore(CACHE_STORE).index('savedAt').openKeyCursor().onsuccess = e => {
        const c = e.target.result;
        if (c){ out.push(c.primaryKey); c.continue(); }
      };
      tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error);
    });
    for (const k of byAge.slice(0, Math.max(0, byAge.length - CACHE_KEEP)))
      await idbRun(db, 'readwrite', st => st.delete(k));
    localStorage.setItem(STORED_FLAG, '1');    // wiadomo, że jest co czyścić i co pokazać
  } finally { db.close(); }
}
function cacheNote(txt){ document.getElementById('cacheNote').textContent = txt || ''; }

// Zapamiętywanie jest DOMYŚLNIE WYŁĄCZONE i tak ma zostać. Zapis przyspiesza kolejne wczytanie
// o niecałe pół sekundy, a kosztuje tym, że czyjaś historia lokalizacji zostaje na dysku po
// zamknięciu karty — na wspólnym komputerze to wyciek. Zysk nie jest wart domyślnego ryzyka;
// kto chce, ten włączy świadomie.
const REMEMBER_PREF = 'thm.remember', STORED_FLAG = 'thm.stored';
function rememberOn(){ return localStorage.getItem(REMEMBER_PREF) === '1'; }

// Samo otwarcie bazy przez idbOpen() by ją ZAŁOŻYŁO, więc u kogoś, kto nigdy nie włączył
// zapamiętywania, zostawiałaby ślad tylko dlatego, że zajrzeliśmy. Najpierw sprawdzamy,
// czy w ogóle jest co oglądać.
async function cacheExists(){
  if (!window.indexedDB) return false;
  if (localStorage.getItem(STORED_FLAG) === '1') return true;
  if (indexedDB.databases){
    try { return (await indexedDB.databases()).some(d => d.name === CACHE_DB); }
    catch { return false; }
  }
  return false;   // bez indexedDB.databases() nie zgadujemy — lepiej nie zakładać bazy
}
async function cacheStats(){
  if (!(await cacheExists())) return { sets:0 };
  try {
    const db = await idbOpen();
    try {
      const keys = await idbRun(db, 'readonly', st => st.getAllKeys());
      // sumujemy klucze indeksu „bytes" — to dokładny rozmiar zapisanych danych.
      // navigator.storage.estimate() tu nie nadaje się: podaje zużycie CAŁEJ domeny
      // (razem z pamięcią podręczną HTTP) i nie reaguje od razu na usunięcie bazy.
      const mb = await new Promise((res, rej) => {
        const tx = db.transaction(CACHE_STORE, 'readonly');
        let sum = 0;
        tx.objectStore(CACHE_STORE).index('bytes').openKeyCursor().onsuccess = e => {
          const c = e.target.result;
          if (c){ sum += c.key || 0; c.continue(); }
        };
        tx.oncomplete = () => res(sum / 1048576); tx.onerror = () => rej(tx.error);
      });
      return { sets: keys.length, mb };
    } finally { db.close(); }
  } catch { return { sets:0 }; }
}
async function refreshPrivacy(){
  const el = document.getElementById('privStored');
  const s = await cacheStats();
  if (!s.sets){
    el.textContent = rememberOn() ? t('priv.pending') : t('priv.none');
  } else {
    const ile = s.sets === 1 ? t('priv.stored1') : t('priv.storedN', s.sets);
    el.textContent = ile + (s.mb ? t('priv.storedSize', s.mb.toFixed(1)) : '.');
  }
  document.getElementById('cacheClear').style.display = s.sets ? '' : 'none';
}
async function cacheWipe(){
  const bylo = await cacheExists();          // sprawdzić ZANIM skasujemy znacznik
  localStorage.removeItem(STORED_FLAG);
  if (!bylo) return;
  const db = await idbOpen();
  try { await idbRun(db, 'readwrite', st => st.clear()); } finally { db.close(); }
  // Samo wyczyszczenie magazynu zostawia pustą bazę i nie zwalnia miejsca, a przycisk obiecuje
  // usunięcie. Kasujemy więc całą bazę i CZEKAMY na wynik — inaczej nie wiadomo, czy się udało.
  await new Promise(res => {
    const req = indexedDB.deleteDatabase(CACHE_DB);
    req.onsuccess = req.onerror = () => res();
    req.onblocked = () => res();          // inna karta trzyma połączenie — magazyn i tak jest pusty
    setTimeout(res, 3000);
  });
}

// ---------- Parsowanie w wątku roboczym ----------
// JSON.parse jest synchroniczny: przy dużym eksporcie zamraża kartę na kilka sekund i nie da
// się w tym czasie pokazać postępu. Wątek roboczy zdejmuje to z wątku głównego.
// Źródło wątku składamy z fragmentów TEGO SAMEGO skryptu, oznaczonych znacznikami CORE —
// dzięki temu parser istnieje w jednej kopii i nie może się rozjechać między wątkami.
let WORKER_SRC = null;
function coreSource(){
  if (WORKER_SRC) return WORKER_SRC;
  const src = document.getElementById('app').textContent;
  const re = /\/\*<<CORE\*\/([\s\S]*?)\/\*CORE>>\*\//g;
  let out = '', m;
  while ((m = re.exec(src))) out += m[1] + '\n';
  if (!out) return null;
  return (WORKER_SRC = out + `
self.onmessage = async (e) => {
  const pliki = e.data.pliki;
  diagReset();
  try {
    for (let i = 0; i < pliki.length; i++){
      const f = pliki[i];
      self.postMessage({ typ:'postep', i, n:pliki.length, nazwa:f.name });
      const nazwa = (f.name || '').toLowerCase();
      if (nazwa.endsWith('.zip')){
        if (typeof JSZip === 'undefined') self.importScripts(e.data.jszip);
        const zip = await JSZip.loadAsync(f);
        const wpisy = Object.values(zip.files).filter(x => !x.dir && x.name.toLowerCase().endsWith('.json'));
        if (!wpisy.length) DIAG.puste.push(f.name);
        for (let k = 0; k < wpisy.length; k++){
          self.postMessage({ typ:'postep', i, n:pliki.length, nazwa:wpisy[k].name.split('/').pop(), k:k+1, kn:wpisy.length });
          diagPlik(wpisy[k].name.split('/').pop(), await wpisy[k].async('string'));
          FILES++;
        }
      } else if (nazwa.endsWith('.json')){
        diagPlik(f.name, await f.text());
        FILES++;
      } else if (DIAG.obce.length < 5) DIAG.obce.push(f.name);
    }
    self.postMessage({ typ:'etap', co:'finalize' });
    resolveModes(); computeHulls(); computeRange();
    const pak = packData();
    pak.diag = DIAG;
    self.postMessage({ typ:'gotowe', pak }, packBuffers(pak));
  } catch (err){
    self.postMessage({ typ:'blad', msg: String(err && err.message || err) });
  }
};
`);
}
// Zwraca spakowane dane albo null, gdy wątek jest niedostępny (stara przeglądarka, CSP,
// brak sieci przy ZIP-ie) — wtedy wywołujący parsuje po staremu na wątku głównym.
function parseInWorker(files, onPostep){
  return new Promise(res => {
    let w = null, url = null;
    const sprzataj = () => { try { w && w.terminate(); } catch(e){} if (url) URL.revokeObjectURL(url); };
    try {
      const src = coreSource();
      if (!src || typeof Worker === 'undefined') return res(null);
      url = URL.createObjectURL(new Blob([src], { type:'text/javascript' }));
      w = new Worker(url);
    } catch (e){ console.warn('Worker niedostępny:', e); sprzataj(); return res(null); }
    w.onerror = e => { console.warn('Worker padł:', e.message || e); sprzataj(); res(null); };
    w.onmessage = ev => {
      const d = ev.data;
      if (d.typ === 'postep' || d.typ === 'etap'){ onPostep(d); return; }
      sprzataj();
      res(d.typ === 'gotowe' ? d.pak : null);
    };
    w.postMessage({ pliki: files, jszip: JSZIP_URL });
  });
}

async function handleFiles(fileList){
  const files = Array.from(fileList);
  if (!files.length) return;
  // Wczytywanie kilku plików po kolei ma je sumować (Records + Semantic to osobne pliki),
  // ale dane przykładowe muszą zniknąć — inaczej użytkownik zobaczyłby własne trasy
  // wymieszane z wymyślonymi i taka mieszanka trafiłaby jeszcze do pamięci podręcznej.
  if (DEMO) clearAll();
  busy(true, t('busy.reading'));
  cacheNote('');
  const key = cacheKey(files);
  const t0 = performance.now();
  try {
    const hit = rememberOn() ? await cacheLoad(key) : null;
    if (hit){
      busy(true, t('busy.cache'));
      unpackData(hit);
      finalizeLoad(true);
      cacheNote(t('load.cached', ((performance.now()-t0)/1000).toFixed(1)));
      return;
    }
  } catch (e){ console.warn('Local cache unavailable on read:', e); }

  // Najpierw wątek roboczy; gdy niedostępny, ta sama robota leci na wątku głównym.
  const pak = await parseInWorker(files, d => {
    if (d.typ === 'etap'){ busy(true, t('busy.finalize')); return; }
    busy(true, d.kn ? t('busy.parseN', d.k, d.kn, d.nazwa)
                    : (files.length > 1 ? t('busy.parseN', d.i+1, d.n, d.nazwa) : t('busy.parse', d.nazwa)));
  });
  if (pak){
    DIAG = pak.diag;
    unpackData(pak);
    finalizeLoad(true);            // tryby, otoczki i zakres dat policzył już wątek roboczy
  } else {
    diagReset();
    try {
      for (const f of files){
        const name = f.name.toLowerCase();
        if (name.endsWith('.zip')) await handleZip(f);
        else if (name.endsWith('.json')){
          busy(true, t('busy.parse', f.name));
          diagPlik(f.name, await f.text());
          FILES++;
        }
        else if (DIAG.obce.length < 5) DIAG.obce.push(f.name);
      }
    } catch (err){ console.error(err); alert(t('err.read', err.message)); }
    finalizeLoad();
  }
  const parseS = ((performance.now()-t0)/1000).toFixed(1);
  showLoadIssues();
  if (!SEGMENTS.length) return;
  if (!rememberOn()){
    cacheNote(t('load.noStore', parseS));
    return;
  }
  // Zapis nie może blokować mapy — użytkownik ma już wynik na ekranie.
  cacheSave(key).then(
    () => { cacheNote(t('load.stored', parseS)); refreshPrivacy(); },
    e  => { console.warn('Could not write local cache:', e);
            cacheNote(t('load.storeFail', parseS)); });
}
async function handleZip(file){
  if (typeof JSZip === 'undefined'){ alert(t('err.nozip')); return; }
  busy(true, t('busy.unzip'));
  const zip = await JSZip.loadAsync(file);
  const entries = Object.values(zip.files).filter(e => !e.dir && e.name.toLowerCase().endsWith('.json'));
  if (!entries.length) DIAG.puste.push(file.name);
  let i = 0;
  for (const e of entries){
    i++;
    busy(true, t('busy.parseN', i, entries.length, e.name.split('/').pop()));
    diagPlik(e.name.split('/').pop(), await e.async('string'));
    FILES++;
    if (i % 15 === 0) await new Promise(r => setTimeout(r));
  }
}

// zarezerwuj w panelu miejsce na dolny pasek, żeby się nie zachodziły na niskich oknach.
// Liczone z innerHeight, a nie 100vh — na telefonie vh obejmuje obszar pod paskiem adresu.
function syncPanelHeight(){
  const qb = document.getElementById('quickBar');
  const reserve = qb.style.display !== 'none' ? (qb.getBoundingClientRect().height + 24) : 0;
  document.getElementById('panel').style.maxHeight = Math.max(160, window.innerHeight - 24 - reserve) + 'px';
}

// Google potrafi zapisać tę samą podróż dwa razy: raz jako gęsty ślad z nawigacji,
// a drugi raz jako goły odcinek start–koniec. Ten drugi rysuje się jako prosta cięciwa
// przez pół mapy, mimo że dokładna trasa jest już narysowana obok. Oznaczamy takie duplikaty.
//
// Warunek jest celowo wąski, bo większość krótkich odcinków to JEDYNY zapis danej podróży
// (Google rzadko próbkuje jazdy bez nawigacji) i wycięcie ich skasowałoby realne kilometry:
// odcinek ma najwyżej 3 punkty, mierzy co najmniej 2 km, jego czas w co najmniej 70% pokrywa
// gęstszy ślad, a OBA jego końce leżą nie dalej niż 3 km od tamtego śladu. Podróż nagrana
// bez nawigacji nie ma gęstego odpowiednika, więc nie spełni tego warunku i zostaje.
let DUP_COUNT = 0, DUP_KM = 0;
function markDuplicates(){
  DUP_COUNT = 0; DUP_KM = 0;
  for (const s of SEGMENTS) s.dup = false;
  const geste = SEGMENTS.filter(s => s.c.length/2 >= 8 && Number.isFinite(s.t)).sort((a,b) => a.t - b.t);
  if (!geste.length) return;
  const startT = geste.map(s => s.t);
  const lower = t => { let lo=0, hi=startT.length;
    while (lo<hi){ const m=(lo+hi)>>1; if (startT[m] < t) lo=m+1; else hi=m; } return lo; };
  const blisko = (lat, lng, g) => {
    for (let i=0;i<g.c.length;i+=2) if (haversine(lat, lng, g.c[i], g.c[i+1]) < 3) return true;
    return false;
  };
  for (const s of SEGMENTS){
    if (s.c.length/2 > 3 || s.gd < 2 || !Number.isFinite(s.t) || !Number.isFinite(s.te)) continue;
    const dur = Math.max(1, s.te - s.t);
    for (let i = Math.max(0, lower(s.t - DAY)); i < geste.length; i++){
      const g = geste[i];
      if (g.t > s.te) break;                       // dalsze zaczynają się jeszcze później
      if (g.te < s.t || g === s) continue;
      if ((Math.min(g.te, s.te) - Math.max(g.t, s.t)) / dur < 0.7) continue;
      if (blisko(s.c[0], s.c[1], g) && blisko(s.c[s.c.length-2], s.c[s.c.length-1], g)){
        s.dup = true; DUP_COUNT++; DUP_KM += s.gd; break;
      }
    }
  }
}

// fromCache — tryby, otoczki i zakres dat są już policzone i wczytane razem z danymi
function finalizeLoad(fromCache){
  if (!fromCache){
    resolveModes();
    // prekalkulacja: otoczka wypukła każdego segmentu (raz, niezależnie od filtrów) —
    // używana zarówno do globalnej średnicy, jak i do łączenia segmentów w ciągłe podróże
    for (const s of SEGMENTS){
      const pts = [];
      for (let i=0;i<s.c.length;i+=2) pts.push([s.c[i], s.c[i+1]]);
      s.hull = convexHull(pts);
    }
    // zakres dat z segmentów
    let mn=Infinity, mx=-Infinity;
    for (const s of SEGMENTS){ if (Number.isFinite(s.t)){ if(s.t<mn)mn=s.t; if(s.t>mx)mx=s.t; } }
    if (Number.isFinite(mn)){ DATA_MIN = dayStart(mn); DATA_MAX = dayStart(mx); }
    else { DATA_MIN = DATA_MAX = null; }
  }

  markDuplicates();          // tanie (kilka ms), więc liczone też przy wczytaniu z pamięci
  updateDupNote();
  heat.setSegments(SEGMENTS);
  buildModeRows();
  initDateSliders();
  applyFilter();
  document.getElementById('controls').style.display = SEGMENTS.length ? 'block' : 'none';
  document.getElementById('stats').style.display   = 'block';
  document.getElementById('quickBar').style.display = SEGMENTS.length ? 'flex' : 'none';
  syncPanelHeight();
  busy(false);
  if (SEGMENTS.length && isNarrow()) setPanelOpen(false);   // na telefonie oddaj ekran mapie
  if (SEGMENTS.length) fitToData();      // brak tras opisuje showLoadIssues, a nie alert
}

function fitToData(){
  if (!SEGMENTS.length) return;
  let minLat=Infinity,minLng=Infinity,maxLat=-Infinity,maxLng=-Infinity;
  for (const s of SEGMENTS){
    if (s.b[0]<minLat)minLat=s.b[0]; if (s.b[2]>maxLat)maxLat=s.b[2];
    if (s.b[1]<minLng)minLng=s.b[1]; if (s.b[3]>maxLng)maxLng=s.b[3];
  }
  map.fitBounds([[minLat,minLng],[maxLat,maxLng]], { padding:[30,30] });
}

// ---------- Filtry + statystyki ----------
const visibleModes = new Set(MODES.map(m => m.k));
function fmtDate(ms){ const d=new Date(ms);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtKm(m){
  const km = m/1000;
  if (km >= 10) return num(Math.round(km)) + ' km';
  return km.toFixed(1) + ' km';
}
function dayIndex(ts){ const d = new Date(ts); return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/DAY); }
function monthKey(ts){ const d = new Date(ts); return d.getFullYear()*12 + d.getMonth(); }
function monthLabel(k){ return t('months')[((k%12)+12)%12] + ' ' + String(Math.floor(k/12)).slice(2); }
function fmtArea(a){ return a >= 100 ? num(Math.round(a))+' km²' : a.toFixed(1)+' km²'; }
function longestStreak(idxSet){
  const arr = [...idxSet].sort((a,b)=>a-b);
  let best = arr.length ? 1 : 0, cur = 1;
  for (let i=1;i<arr.length;i++){ if (arr[i]-arr[i-1]===1) cur++; else cur=1; if (cur>best) best=cur; }
  return best;
}

function currentRange(){
  if (DATA_MIN == null) return { from:-Infinity, to:Infinity };
  const fi = +document.getElementById('dFrom').value;
  const ti = +document.getElementById('dTo').value;
  return { from: DATA_MIN + fi*DAY, to: DATA_MIN + (ti+1)*DAY - 1 };
}
// Zakres faktycznie pokazany na mapie: zawężony do wybranego rekordu/okresu, inaczej z suwaków.
// Statystyki liczymy z niego, żeby opisywały to, co widać (wyjątek: wykres w czasie — patrz updateGeoStats).
function activeRange(){
  const rec = recordShown && RECORD[recordShown];
  return rec ? { from:rec.from, to:rec.to } : currentRange();
}
function applyFilter(){
  stopTimelapse(false);                                // każda zmiana filtra przerywa animację
  if (recordShown){ exitRecordView(false); return; }   // wyjście z rekordu samo odświeża filtr i statystyki
  const r = currentRange();
  heat.setFilter({ from:r.from, to:r.to, modes:new Set(visibleModes) });
  updateStats(r);
  scheduleGeo();
}

// ---------- Timelapse ----------
// Przesuwa górną granicę filtra od początku do końca wybranego zakresu, więc ślad narasta.
// Postęp liczony z zegara, a nie z liczby klatek — dzięki temu animacja trwa tyle, ile obiecuje,
// niezależnie od tego, ile klatek uda się wyrenderować (w karcie w tle timery i tak są dławione).
let TL = null;   // { from, to, durMs, start, timer, lastStats }
function startTimelapse(){
  if (!SEGMENTS.length || TL) return;
  if (recordShown) exitRecordView(false);
  const r = currentRange();
  if (!(r.to > r.from)) return;
  TL = { from:r.from, to:r.to, durMs: (+document.getElementById('tlDur').value)*1000,
         start: performance.now(), timer: null };
  heat.setFilter({ from:r.from, to:r.from, modes:new Set(visibleModes) });   // czysta kanwa na start
  document.getElementById('tlPlay').textContent = t('tl.stop');
  tlStep();
}
function tlStep(){
  if (!TL) return;
  const p = Math.min(1, (performance.now() - TL.start) / TL.durMs);
  const cur = TL.from + (TL.to - TL.from)*p;
  heat.extendFilterTo(cur);
  document.getElementById('tlLbl').textContent = fmtDate(TL.from) + ' → ' + fmtDate(cur);
  // licznik kilometrów ma rosnąć razem ze śladem, ale nie 30 razy na sekundę
  const now = performance.now();
  if (!TL.lastStats || now - TL.lastStats > 300){ TL.lastStats = now; updateStats({ from:TL.from, to:cur }); }
  if (p >= 1){ stopTimelapse(true); return; }
  TL.timer = setTimeout(tlStep, 33);
}
// W karcie w tle przeglądarka dławi timery do jednego wybudzenia na minutę, więc animacja
// i tak by stanęła — lepiej wstrzymać ją świadomie i wznowić od tego samego miejsca,
// zamiast pozwolić jej „przewinąć się" niewidocznie.
document.addEventListener('visibilitychange', () => {
  if (!TL) return;
  if (document.hidden){ clearTimeout(TL.timer); TL.timer = null; TL.pausedAt = performance.now(); }
  else if (TL.pausedAt != null){ TL.start += performance.now() - TL.pausedAt; TL.pausedAt = null; tlStep(); }
});
function stopTimelapse(refresh){
  if (!TL) return;
  clearTimeout(TL.timer); TL = null;
  document.getElementById('tlPlay').textContent = t('tl.play');
  document.getElementById('tlLbl').textContent = t('tl.hint');
  if (refresh) applyFilter();
}

// Statystyki odległości (cięższe) — liczone z opóźnieniem, by suwak był płynny
let geoTimer = null;
function scheduleGeo(){
  document.getElementById('stDiam').textContent = '…';
  document.getElementById('stConn').textContent = '…';
  clearTimeout(geoTimer);
  geoTimer = setTimeout(updateGeoStats, 160);
}
function updateGeoStats(){
  const r = activeRange();
  const inRange = t => !Number.isFinite(t) || (t >= r.from && t <= r.to);
  const cand = [];                // kandydaci do globalnej średnicy (wierzchołki otoczek)
  let n=-Infinity, s2=Infinity, e=-Infinity, w=Infinity;  // skrajne współrzędne
  let np=null, sp=null, ep=null, wp=null;                 // punkty skrajne [lat,lng]
  let sumLat=0, sumLng=0, cnt=0;                          // do centroidy
  const cells = new Set();                                // odwiedzone rejony (~5 km) — tylko ruch naziemny (bez lotów)
  for (const s of SEGMENTS){
    if (!inRange(s.t) || !visibleModes.has(s.mode)) continue;
    if (s.hull) for (const p of s.hull) cand.push(p);
    const ground = s.mode !== 'flight';                   // loty: liczą się do zasięgu, ale NIE do „odwiedzonych"
    const c = s.c;
    for (let i=0;i<c.length;i+=2){
      const la=c[i], ln=c[i+1];
      if (la>n){ n=la; np=[la,ln]; }
      if (la<s2){ s2=la; sp=[la,ln]; }
      if (ln>e){ e=ln; ep=[la,ln]; }
      if (ln<w){ w=ln; wp=[la,ln]; }
      sumLat+=la; sumLng+=ln; cnt++;
      if (ground) cells.add(Math.round(la/0.05)+'_'+Math.round(ln/0.05));
    }
  }
  const hull = cand.length ? convexHull(cand) : [];
  const gp = hull.length ? farthestPair(hull) : { km:0, a:null, b:null };
  GEO.diam = { km:gp.km, a:gp.a, b:gp.b };

  // Najdłuższy ciągły ślad: sąsiednie segmenty łączymy w jedną podróż, jeśli przerwa < 24h
  // ORAZ w międzyczasie nie było powrotu do domu (nawet krótkiego) — tak wielodniowa wycieczka
  // z noclegami poza domem liczy się jako jedna ciągła trasa, a codzienne dojazdy do pracy nie.
  const CHAIN_GAP_MS = 24*3600*1000;
  const homeTimes = VISITS.filter(v => v.type==='home' && Number.isFinite(v.t)).map(v=>v.t).sort((a,b)=>a-b);
  const homeBetween = (t0, t1) => {
    if (!homeTimes.length || !(t1 > t0)) return false;
    let lo=0, hi=homeTimes.length;
    while (lo<hi){ const m=(lo+hi)>>1; if (homeTimes[m] < t0) lo=m+1; else hi=m; }
    return lo < homeTimes.length && homeTimes[lo] <= t1;
  };
  const chained = SEGMENTS.filter(s => inRange(s.t) && visibleModes.has(s.mode) && Number.isFinite(s.t))
                          .sort((a,b) => a.t - b.t);
  let bestChainKm = 0, bestChainA = null, bestChainB = null;
  let chainPts = [], chainEnd = -Infinity;
  const flushChain = () => {
    if (chainPts.length){
      const ch = convexHull(chainPts);
      const fp = farthestPair(ch);
      if (fp.km > bestChainKm){ bestChainKm = fp.km; bestChainA = fp.a; bestChainB = fp.b; }
    }
    chainPts = [];
  };
  for (const s of chained){
    const te = Number.isFinite(s.te) ? s.te : s.t;
    if (chainPts.length && (s.t - chainEnd > CHAIN_GAP_MS || homeBetween(chainEnd, s.t))) flushChain();
    if (s.hull && s.hull.length) for (const p of s.hull) chainPts.push(p);
    chainEnd = Math.max(chainEnd, te);
  }
  flushChain();
  GEO.conn = { km:bestChainKm, a:bestChainA, b:bestChainB };

  const centroid = cnt ? [sumLat/cnt, sumLng/cnt] : null;
  GEO.ext = { n:np, s:sp, e:ep, w:wp, centroid };
  document.getElementById('stDiam').textContent = cand.length ? fmtKm(GEO.diam.km*1000) : '—';
  document.getElementById('stConn').textContent = bestChainKm > 0 ? fmtKm(GEO.conn.km*1000) : '—';

  // Zasięg geograficzny
  const setExt = (id, p, val) => document.getElementById(id).textContent = p ? val : '—';
  setExt('gN', np, np && np[0].toFixed(3)+'°');
  setExt('gS', sp, sp && sp[0].toFixed(3)+'°');
  setExt('gE', ep, ep && ep[1].toFixed(3)+'°');
  setExt('gW', wp, wp && wp[1].toFixed(3)+'°');
  setExt('gC', centroid, centroid && (centroid[0].toFixed(3)+'°, '+centroid[1].toFixed(3)+'°'));
  // realny odwiedzony obszar = suma pól odwiedzonych rejonów (~5 km), z korektą na szerokość geogr.
  let footprint = 0; const CELL = 0.05, KMDEG = 111.32;
  for (const key of cells){
    const lat = parseInt(key, 10) * CELL;
    footprint += (CELL*KMDEG) * (CELL*KMDEG*Math.cos(lat*Math.PI/180));
  }
  document.getElementById('gArea').textContent  = cells.size ? fmtArea(footprint) : '—';
  document.getElementById('gCells').textContent = cnt ? num(cells.size) : '—';

  // Odwiedzone kraje (potrzebne granice z CDN — dociągane leniwie)
  const cEl = document.getElementById('gCountries');
  if (!cnt){ cEl.textContent = '—'; VISITED_CC.clear(); VISITED_LIST = []; }
  else if (COUNTRIES){
    detectCountries(cells);
    cEl.textContent = num(VISITED_CC.size);
    refreshCountryStyles();
  } else {
    cEl.textContent = '…';
    loadCountries().then(() => updateGeoStats()).catch(() => { cEl.textContent = '—'; renderCountryList(); });
  }
  renderCountryList();

  drawDowHour(r, inRange);
  // wykres w czasie zawsze z pełnego zakresu suwaków — inaczej po kliknięciu słupka
  // zostałby na wykresie tylko ten jeden okres i nie dałoby się przełączyć na inny
  const rAll = currentRange();
  drawMonthChart(rAll, t => !Number.isFinite(t) || (t >= rAll.from && t <= rAll.to));
  refreshMeasure();
}

// Mini-heatmapa 7×24 (dzień tygodnia × godzina), jasność = km
function drawDowHour(r, inRange){
  const cv = document.getElementById('dowHour'); if (!cv) return;
  const buckets = new Float64Array(7*24);
  const add = (t, km) => {
    if (!Number.isFinite(t)) return;
    const d = new Date(t), dw = (d.getDay()+6)%7;      // Pn=0 … Nd=6
    buckets[dw*24 + d.getHours()] += km;
  };
  if (ACTIVITIES.length){
    for (const a of ACTIVITIES){ if (inRange(a.t) && visibleModes.has(a.mode)) add(a.t, a.dist/1000); }
  } else {
    for (const s of SEGMENTS){ if (inRange(s.t) && visibleModes.has(s.mode)) add(s.t, s.gd); }
  }
  let maxV = 0; for (const v of buckets) if (v>maxV) maxV=v;
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth || 284, labelW = 20, rowH = 13, top = 2, botLbl = 12;
  const H = 7*rowH + top + botLbl;
  cv.width = W*dpr; cv.height = H*dpr; cv.style.height = H+'px';
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  const cellW = (W-labelW)/24, dows = t('dow');
  ctx.font = '9px -apple-system,Segoe UI,sans-serif'; ctx.textBaseline = 'middle';
  for (let dw=0; dw<7; dw++){
    ctx.fillStyle = '#6b7482'; ctx.textAlign = 'left';
    ctx.fillText(dows[dw], 0, top + dw*rowH + rowH/2);
    for (let h=0; h<24; h++){
      const a = maxV>0 ? buckets[dw*24+h]/maxV : 0;
      ctx.fillStyle = a>0 ? `rgba(255,122,26,${0.12 + 0.88*Math.sqrt(a)})` : '#20242d';
      ctx.fillRect(labelW + h*cellW, top + dw*rowH, Math.max(1,cellW-1), rowH-1);
    }
  }
  ctx.fillStyle = '#6b7482'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (const h of [0,6,12,18,23]) ctx.fillText(String(h), labelW + h*cellW + cellW/2, 7*rowH + top + 2);
}

// Wykres słupkowy: km w czasie — miesięcznie, a przy długim zakresie automatycznie rocznie
let CHART = null;      // { bars:[{label,short,v,key,from,to}], yearly, maxV, maxLabel }
const AX_W = 26;       // szerokość osi Y wykresu — używana też przy trafianiu w słupek kliknięciem

function drawMonthChart(r, inRange){
  const cv = document.getElementById('monthChart'); if (!cv) return;
  const m = new Map();
  const add = (t, km) => { if (Number.isFinite(t)) m.set(monthKey(t), (m.get(monthKey(t))||0)+km); };
  if (ACTIVITIES.length){
    for (const a of ACTIVITIES){ if (inRange(a.t) && visibleModes.has(a.mode)) add(a.t, a.dist/1000); }
  } else {
    for (const s of SEGMENTS){ if (inRange(s.t) && visibleModes.has(s.mode)) add(s.t, s.gd); }
  }
  const hdr = document.getElementById('chTimeHdr'), lbl = document.getElementById('monthLbl');
  const mKeys = [...m.keys()].sort((a,b)=>a-b);
  if (!mKeys.length){
    CHART = null;
    const dpr0 = window.devicePixelRatio || 1, W0 = cv.clientWidth || 284, H0 = 74;
    cv.width = W0*dpr0; cv.height = H0*dpr0; cv.style.height = H0+'px';
    cv.getContext('2d').clearRect(0, 0, cv.width, cv.height);
    if (lbl) lbl.textContent = '—';
    if (hdr) hdr.textContent = 'Kilometry w czasie';
    return;
  }
  const spanMonths = mKeys[mKeys.length-1] - mKeys[0] + 1;
  const yearly = spanMonths > 36;   // >3 lata → agreguj rocznie, by słupki były czytelne

  // zbuduj ciągłą tablicę słupków (bez luk); from/to = zakres czasu słupka (do izolacji na mapie)
  const bars = [];
  if (yearly){
    const y0 = Math.floor(mKeys[0]/12), y1 = Math.floor(mKeys[mKeys.length-1]/12);
    const ym = new Map();
    for (const [k,v] of m){ const y = Math.floor(k/12); ym.set(y, (ym.get(y)||0)+v); }
    for (let y=y0; y<=y1; y++)
      bars.push({ label:String(y), short:"'"+String(y).slice(2), v: ym.get(y)||0, key:'y'+y,
                  from: new Date(y,0,1).getTime(), to: new Date(y+1,0,1).getTime()-1 });
    if (hdr) hdr.textContent = t('ch.years');
  } else {
    for (let k=mKeys[0]; k<=mKeys[mKeys.length-1]; k++){
      const y = Math.floor(k/12), mo = ((k%12)+12)%12;
      bars.push({ label:monthLabel(k), short:monthLabel(k), v: m.get(k)||0, key:'m'+k,
                  from: new Date(y,mo,1).getTime(), to: new Date(y,mo+1,1).getTime()-1 });
    }
    if (hdr) hdr.textContent = t('ch.months');
  }
  let maxV = 0, maxLabel = ''; for (const b of bars) if (b.v>maxV){ maxV=b.v; maxLabel=b.label; }
  CHART = { bars, yearly, maxV, maxLabel };
  paintMonthChart();
}

function paintMonthChart(){
  const cv = document.getElementById('monthChart'); if (!cv || !CHART) return;
  const { bars, yearly, maxV, maxLabel } = CHART;
  const lbl = document.getElementById('monthLbl');
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth || 284, H = 74;
  cv.width = W*dpr; cv.height = H*dpr; cv.style.height = H+'px';
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  const selKey = (recordShown === 'period' && RECORD.period) ? RECORD.period.key : null;
  const bw = (W - AX_W)/bars.length, botLbl = 12, plotH = H - botLbl - 2;
  ctx.font = '9px -apple-system,Segoe UI,sans-serif';

  // oś Y: linie siatki dla maks. i połowy maks. (rysowane pod słupkami)
  if (maxV > 0){
    const axLbl = v => v >= 1000 ? Math.round(v/1000)+'k' : String(Math.round(v));
    ctx.textBaseline = 'middle'; ctx.textAlign = 'right';
    for (const frac of [1, 0.5]){
      const y = Math.round(plotH - frac*plotH + 2) + 0.5;
      ctx.strokeStyle = '#2a303b'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(AX_W, y); ctx.lineTo(W, y); ctx.stroke();
      ctx.fillStyle = '#6b7482';
      ctx.fillText(axLbl(maxV*frac), AX_W-4, Math.max(5, y));
    }
  }

  for (let i=0;i<bars.length;i++){
    const h = maxV>0 ? (bars[i].v/maxV)*plotH : 0;
    ctx.fillStyle = bars[i].key === selKey ? '#ffffff' : (bars[i].v>0 ? '#ff7a1a' : '#20242d');
    ctx.fillRect(AX_W + i*bw + 0.5, plotH - h + 2, Math.max(1, bw-1), Math.max(bars[i].v>0?1:0, h));
  }
  ctx.textBaseline = 'top';
  if (yearly && bars.length <= 16){
    // podpisz każdy rok, jeśli się mieszczą
    ctx.textAlign = 'center';
    for (let i=0;i<bars.length;i++){
      ctx.fillStyle = bars[i].key === selKey ? '#e7ebf0' : '#6b7482';
      ctx.fillText(bars[i].short, AX_W + i*bw + bw/2, plotH+3);
    }
  } else {
    ctx.fillStyle = '#6b7482';
    ctx.textAlign = 'left';  ctx.fillText(bars[0].label, AX_W+1, plotH+3);
    ctx.textAlign = 'right'; ctx.fillText(bars[bars.length-1].label, W-1, plotH+3);
  }
  if (lbl){
    const sel = selKey ? bars.find(b => b.key === selKey) : null;
    lbl.textContent = sel
      ? t('ch.isolated', sel.label, fmtKm(sel.v*1000))
      : (yearly ? t('ch.topYear') : t('ch.topMonth')) + fmtKm(maxV*1000)
        + (maxLabel ? ' (' + maxLabel + ').' : '.') + t('ch.clickHint');
  }
}

const GEO = { diam:null, conn:null, ext:null };
let measureShown = null;                         // 'diam' | 'conn' | null
const measureLayer = L.layerGroup().addTo(map);
const poiLayer = L.layerGroup().addTo(map);

// ---------- Izolacja rekordu (najdłuższa podróż / najwięcej w 1 dzień) na mapie ----------
const RECORD = { trip:null, day:null, period:null };   // {from, to, modes:Set} — trip/day z updateStats(), period z klikniętego słupka
let recordShown = null;                   // 'trip' | 'day' | 'period' | null
let recordPrevView = null;                // { center, zoom } widoku sprzed kliknięcia rekordu
function toggleRecord(kind, force){       // force = wejdź w nowy okres bez przełączania w tryb wyjścia
  stopTimelapse(false);
  const rec = RECORD[kind];
  if (recordShown === kind && !force){ exitRecordView(true); return; }
  if (!rec) return;
  if (!recordShown) recordPrevView = { center: map.getCenter(), zoom: map.getZoom() };
  recordShown = kind;
  document.getElementById('statTrip').classList.toggle('active', kind==='trip');
  document.getElementById('statDay').classList.toggle('active', kind==='day');
  document.getElementById('qTrip').classList.toggle('active', kind==='trip');
  heat.setFilter({ from: rec.from, to: rec.to, modes: rec.modes });
  let minLat=Infinity,minLng=Infinity,maxLat=-Infinity,maxLng=-Infinity;
  for (const s of SEGMENTS){
    if (s.t < rec.from || s.t > rec.to) continue;
    if (rec.modes && !rec.modes.has(s.mode)) continue;
    if (s.b[0]<minLat)minLat=s.b[0]; if (s.b[2]>maxLat)maxLat=s.b[2];
    if (s.b[1]<minLng)minLng=s.b[1]; if (s.b[3]>maxLng)maxLng=s.b[3];
  }
  if (minLat!==Infinity) map.fitBounds([[minLat,minLng],[maxLat,maxLng]], { padding:[50,50], maxZoom:12 });
  updateStats();      // statystyki opisują teraz tylko wyizolowany okres
  scheduleGeo();
  paintMonthChart();
}
function exitRecordView(restoreView){
  if (!recordShown) return;
  recordShown = null;
  RECORD.period = null;
  document.getElementById('statTrip').classList.remove('active');
  document.getElementById('statDay').classList.remove('active');
  document.getElementById('qTrip').classList.remove('active');
  const r = currentRange();
  heat.setFilter({ from:r.from, to:r.to, modes:new Set(visibleModes) });
  if (restoreView && recordPrevView) map.setView(recordPrevView.center, recordPrevView.zoom, { animate:true });
  recordPrevView = null;
  updateStats(r);     // powrót statystyk do pełnego zakresu z suwaków
  scheduleGeo();
  paintMonthChart();
}
function toggleMeasure(kind){
  measureShown = (measureShown === kind) ? null : kind;
  refreshMeasure();
  document.getElementById('statDiam').classList.toggle('active', measureShown==='diam');
  document.getElementById('statConn').classList.toggle('active', measureShown==='conn');
  const g = GEO[kind];
  if (measureShown && g && g.a && g.b) map.fitBounds([g.a, g.b], { padding:[60,60], maxZoom:12 });
}
function refreshMeasure(){
  measureLayer.clearLayers();
  if (!measureShown) return;
  const g = GEO[measureShown];
  if (!g || !g.a || !g.b) return;
  const color = measureShown==='diam' ? '#ffffff' : '#ffd60a';
  const line = L.polyline([g.a, g.b], { color, weight:2, dashArray:'6 7', opacity:0.95 });
  line.bindTooltip(fmtKm(g.km*1000) + ' w linii prostej',
                   { permanent:true, direction:'center', className:'measure-tip', offset:[0,0] });
  measureLayer.addLayer(line);
  for (const p of [g.a, g.b])
    measureLayer.addLayer(L.circleMarker(p, { radius:5, color, fillColor:color, fillOpacity:1, weight:1.5 }));
}

function initDateSliders(){
  const from = document.getElementById('dFrom'), to = document.getElementById('dTo');
  const dtFrom = document.getElementById('dtFrom'), dtTo = document.getElementById('dtTo');

    from.max = to.max = 0; from.value = to.value = 0;
    dtFrom.value = dtTo.value = ''; dtFrom.min = dtTo.min = dtFrom.max = dtTo.max = '';
    setDateLabels(); return;
  }
  const days = Math.max(0, Math.round((DATA_MAX - DATA_MIN)/DAY));
  from.max = to.max = days;
  from.value = 0; to.value = days;
  dtFrom.min = dtTo.min = fmtDate(DATA_MIN);          // kalendarz ograniczony do posiadanych danych

  setDateLabels();
}
function setDateLabels(){
  const dtFrom = document.getElementById('dtFrom'), dtTo = document.getElementById('dtTo');
  if (DATA_MIN == null){ dtFrom.value = ''; dtTo.value = ''; return; }
  dtFrom.value = fmtDate(DATA_MIN + (+document.getElementById('dFrom').value)*DAY);
  dtTo.value   = fmtDate(DATA_MIN + (+document.getElementById('dTo').value)*DAY);
}
// odwrotność etykiety suwaka: 'RRRR-MM-DD' -> pozycja suwaka (numer doby od początku danych)
function dayIndexFromDateStr(str){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str || '');
  if (!m || DATA_MIN == null) return null;
  const target = new Date(+m[1], +m[2]-1, +m[3]).getTime();
  if (!Number.isFinite(target)) return null;
  const days = +document.getElementById('dFrom').max;
  return Math.max(0, Math.min(days, Math.round((target - dayStart(DATA_MIN)) / DAY)));
}

function updateStats(r){
  r = r || activeRange();
  const inRange = t => !Number.isFinite(t) || (t >= r.from && t <= r.to);
  // dystans wg trybu
  const dist = {}, spDur = {};                                    // dystans / trwanie (ms) wg trybu
  for (const m of MODES){ dist[m.k] = 0; spDur[m.k] = 0; }
  let trips = 0, total = 0, haveActivities = ACTIVITIES.length > 0;
  let longTrip = 0;                                               // najdłuższa pojedyncza podróż (m)
  let longTripT = null, longTripTe = null, longTripMode = null;   // zakres czasu + tryb rekordowej podróży
  const dayKm = new Map(), monthKm = new Map();                   // dzień/miesiąc -> km
  const addKm = (t, km) => {
    if (Number.isFinite(t)){
      const di = dayIndex(t); dayKm.set(di, (dayKm.get(di)||0) + km);
      const mk = monthKey(t);  monthKm.set(mk, (monthKm.get(mk)||0) + km);
    }
  };
  for (const a of ACTIVITIES){
    if (!inRange(a.t)) continue;
    if (!visibleModes.has(a.mode)) continue;
    dist[a.mode] += a.dist; total += a.dist; trips++;
    if (a.dist > longTrip){ longTrip = a.dist; longTripT = a.t; longTripTe = a.te; longTripMode = a.mode; }
    const dur = a.te - a.t; if (dur > 0) spDur[a.mode] += dur;
    addKm(a.t, a.dist/1000);
  }
  if (!haveActivities){ // fallback: dystans z geometrii tras
    for (const s of SEGMENTS){
      if (!inRange(s.t) || !visibleModes.has(s.mode)) continue;
      total += s.gd*1000;
      if (s.gd*1000 > longTrip){ longTrip = s.gd*1000; longTripT = s.t; longTripTe = s.te; longTripMode = s.mode; }
      addKm(s.t, s.gd);
    }
  }
  // aktywne dni (indeksy dób lokalnych — do liczby i najdłuższej serii)
  const days = new Set();
  for (const s of SEGMENTS){ if (inRange(s.t) && visibleModes.has(s.mode) && Number.isFinite(s.t)) days.add(dayIndex(s.t)); }
  // wizyty
  let home=0, work=0;
  for (const v of VISITS){ if (!inRange(v.t)) continue; if (v.type==='home') home++; else if (v.type==='work') work++; }

  document.getElementById('stDist').textContent = fmtKm(total);
  document.getElementById('stTrips').textContent = num(trips);
  document.getElementById('stDays').textContent  = num(days.size);
  document.getElementById('stHome').textContent  = num(home);
  document.getElementById('stWork').textContent  = num(work);
  document.getElementById('stDistLbl').textContent = haveActivities ? t('q.distRange') : t('q.distGeom');

  for (const m of MODES){
    const el = document.getElementById('km-'+m.k);
    if (el) el.textContent = haveActivities ? fmtKm(dist[m.k]) : '';
  }

  // --- Rekordy ---
  const rTripTxt = longTrip > 0 ? fmtKm(longTrip) : '—';
  document.getElementById('rTrip').textContent = rTripTxt;
  document.getElementById('qTripVal').textContent = rTripTxt;
  RECORD.trip = (longTrip > 0 && longTripT != null)
    ? { from: longTripT, to: Number.isFinite(longTripTe) ? longTripTe : longTripT, modes: new Set([longTripMode]) }
    : null;
  let bestDayKm = 0, bestDayIdx = null;
  for (const [di, km] of dayKm) if (km > bestDayKm){ bestDayKm = km; bestDayIdx = di; }
  const rDay = document.getElementById('rDay');
  rDay.textContent = bestDayKm > 0 ? fmtKm(bestDayKm*1000) : '—';
  rDay.title = bestDayIdx != null ? fmtDate(bestDayIdx*DAY) : '';
  RECORD.day = (bestDayKm > 0 && bestDayIdx != null)
    ? { from: bestDayIdx*DAY, to: (bestDayIdx+1)*DAY - 1, modes: new Set(visibleModes) }
    : null;
  if (recordShown && !RECORD[recordShown]) exitRecordView(false);   // rekord zniknął po zmianie filtrów
  document.getElementById('statTrip').classList.toggle('clickable', !!RECORD.trip);
  document.getElementById('statDay').classList.toggle('clickable', !!RECORD.day);
  document.getElementById('qTrip').classList.toggle('clickable', !!RECORD.trip);
  const streak = longestStreak(days);
  document.getElementById('rStreak').textContent = streak > 0 ? num(streak)+t('unit.days') : '—';
  let bestMonthKm = 0, bestMonthK = null;
  for (const [mk, km] of monthKm) if (km > bestMonthKm){ bestMonthKm = km; bestMonthK = mk; }
  const rMonth = document.getElementById('rMonth');
  rMonth.textContent = bestMonthK != null ? monthLabel(bestMonthK) : '—';
  rMonth.title = bestMonthK != null ? fmtKm(bestMonthKm*1000) : '';

  // --- Prędkości wg trybu ---
  const spHost = document.getElementById('speedRows');
  spHost.innerHTML = '';
  let anySpeed = false;
  for (const m of MODES){
    if (!(spDur[m.k] > 0 && dist[m.k] > 0) || !visibleModes.has(m.k)) continue;
    anySpeed = true;
    const kmh = (dist[m.k]/1000) / (spDur[m.k]/3600000);
    const row = document.createElement('div');
    row.className = 'spanStat';
    row.innerHTML = `<span><span class="spdDot" style="background:${m.c}"></span>${modeName(m.k)}</span>`
                  + `<b>${kmh.toFixed(0)} km/h</b>`;
    spHost.appendChild(row);
  }
  if (!anySpeed) spHost.innerHTML = '<div class="metaLine">' + t('speed.none') + '</div>';

  // --- Dla zabawy (ekwiwalenty) ---
  const km = total/1000;
  document.getElementById('funPL').textContent   = km > 0 ? (km/3511).toFixed(1)+'×' : '—';
  document.getElementById('funEq').textContent   = km > 0 ? (km/40075).toFixed(2)+'×' : '—';
  document.getElementById('funMoon').textContent = km > 0 ? (km/384400*100).toFixed(2)+'%' : '—';
  const co2t = (dist.car/1000) * 0.12 / 1000;   // ~0,12 kg CO₂/km, w tonach
  document.getElementById('funCO2').textContent = dist.car > 0
    ? (co2t >= 1 ? co2t.toFixed(1)+' t' : num(Math.round(co2t*1000))+' kg') : '—';

  document.getElementById('sSeg').textContent   = num(SEGMENTS.length);
  document.getElementById('sPts').textContent   = num(TOTAL_PTS);
  document.getElementById('sFiles').textContent = num(FILES);
  document.getElementById('sFmt').textContent   = FORMATS.size ? [...FORMATS].map(f => t(f)).join(', ') : '—';
  document.getElementById('stRange').textContent = DATA_MIN!=null ? (fmtDate(DATA_MIN)+' → '+fmtDate(DATA_MAX)) : '—';
}

function buildModeRows(){
  const host = document.getElementById('modes');
  host.innerHTML = '';
  for (const m of MODES){
    const row = document.createElement('label');
    row.className = 'modeRow';
    row.innerHTML =
      `<input type="checkbox" data-mode="${m.k}" ${visibleModes.has(m.k)?'checked':''}>` +
      `<span class="sw" style="background:${m.c}"></span>` +
      `<span class="mName">${modeName(m.k)}</span>` +
      `<span class="mKm" id="km-${m.k}"></span>`;
    const cb = row.querySelector('input');
    cb.addEventListener('change', () => {
      if (cb.checked) visibleModes.add(m.k); else visibleModes.delete(m.k);
      row.classList.toggle('off', !cb.checked);
      applyFilter();
    });
    row.classList.toggle('off', !visibleModes.has(m.k));
    host.appendChild(row);
  }
}

// ---------- Eksport PNG ----------
function exportPNG(){
  busy(true, 'Generowanie PNG…');
  setTimeout(() => {
    try {
      const size = map.getSize();
      const bg = curBasemap === 'light' ? '#e9ecef' : '#0d0f13';
      const cont = map.getContainer(), crect = cont.getBoundingClientRect();
      const S = Math.max(2, renderScale());   // ślad rysowany od nowa w tej skali, nie skalowany z ekranu

      const build = (withTiles) => {
        const out = document.createElement('canvas');
        out.width = Math.round(size.x*S); out.height = Math.round(size.y*S);
        const o = out.getContext('2d');
        o.fillStyle = withTiles && curBasemap==='none' ? '#000' : bg;
        o.fillRect(0,0,out.width,out.height);
        if (withTiles && baseLayer){
          cont.querySelectorAll('img.leaflet-tile-loaded').forEach(img => {
            const rr = img.getBoundingClientRect();
            o.drawImage(img, (rr.left-crect.left)*S, (rr.top-crect.top)*S, rr.width*S, rr.height*S);
          });
        }
        o.setTransform(S,0,0,S,0,0);
        heat._paint(o);
        return out;
      };

      // blob zamiast data URL — w skali 2× obraz bywa kilkudziesięciomegabajtowy
      const toBlob = (cv) => new Promise((res, rej) =>
        cv.toBlob(b => b ? res(b) : rej(new Error('pusty obraz')), 'image/png'));
      // toBlob rzuca SecurityError wewnątrz konstruktora Promise, więc fallback musi wisieć na .catch
      toBlob(build(true))                          // pełny: kafelki + ślad
        .catch(() => toBlob(build(false)))         // fallback bez kafelków (kafelki bez CORS)
        .then(blob => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = 'heatmapa.png'; a.click();
          setTimeout(() => URL.revokeObjectURL(url), 10000);
        })
        .catch(e => { console.error(e); alert(t('err.png', e.message)); })
        .then(() => busy(false));
      return;
    } catch (e){
      console.error(e);
      alert(t('err.png', e.message));
    }
    busy(false);
  }, 60);
}

// ---------- Tryby wyglądu śladu ----------
// Heatmapa: additywne, ledwo widoczne linie na ciemnym tle — nakładanie rozjaśnia aż do bieli (styl Stravy).
// Jednolite linie: zwykłe krycie na jasnym tle — nakładanie nasyca kolor, ale nigdy nie bieleje,
// więc pojedynczy przejazd i sto przejazdów mają tę samą grubość (styl StatsHunters).
const STYLE_MODES = {
  heat:  { color:'#ff7a1a', opacity:0.14, weight:1.6, additive:true,  basemap:'dark',
           opLblKey:'style.bright',
           hintKey:'style.heatHint' },
  lines: { color:'#ff1f1f', opacity:0.45, weight:2.2, additive:false, basemap:'light',
           opLblKey:'style.alpha',
           hintKey:'style.linesHint' },
};
let styleMode = 'heat';
// keepBasemap — przy starcie, żeby nie przeładowywać kafelków ustawionych już przez setBasemap()
function applyStyleMode(key, keepBasemap){
  const p = STYLE_MODES[key]; if (!p) return;
  styleMode = key;
  heat.setStyle({ color:p.color, opacity:p.opacity, weight:p.weight, additive:p.additive });
  $('styleMode').value = key;
  $('color').value   = p.color;
  $('opacity').value = p.opacity; $('opVal').textContent = p.opacity.toFixed(2);
  $('weight').value  = p.weight;  $('wVal').textContent  = p.weight.toFixed(1);
  $('opLbl').textContent     = t(p.opLblKey);
  $('styleHint').textContent = t(p.hintKey);
  if (!keepBasemap && curBasemap !== p.basemap){ setBasemap(p.basemap); $('basemap').value = p.basemap; }
}
$('styleMode').addEventListener('change', e => applyStyleMode(e.target.value));
// suwaki zapisują się do presetu aktywnego trybu — powrót do trybu przywraca własne ustawienia,
// a nie fabryczne
$('color').addEventListener('input',   e => { STYLE_MODES[styleMode].color = e.target.value; heat.setStyle({ color: e.target.value }); });
$('opacity').addEventListener('input', e => { const v = +e.target.value; STYLE_MODES[styleMode].opacity = v;
                                              $('opVal').textContent = v.toFixed(2); heat.setStyle({ opacity:v }); });
$('weight').addEventListener('input',  e => { const v = +e.target.value; STYLE_MODES[styleMode].weight = v;
                                              $('wVal').textContent = v.toFixed(1);  heat.setStyle({ weight:v }); });
$('colorByMode').addEventListener('change', e => heat.setColorByMode(e.target.checked));
$('hideDup').addEventListener('change', e => heat.setHideDup(e.target.checked));
$('basemap').addEventListener('change', e => { setBasemap(e.target.value); STYLE_MODES[styleMode].basemap = e.target.value; });
applyStyleMode('heat', true);
$('showCountries').addEventListener('change', e => {
  countryShow = e.target.checked;
  if (countryShow){
    loadCountries().then(() => { renderCountryLayer(); refreshCountryStyles(); })
                   .catch(() => { $('showCountries').checked = false; countryShow = false;
                                  alert(t('err.borders')); });
  } else renderCountryLayer();
});
$('fit').addEventListener('click', fitToData);
$('png').addEventListener('click', exportPNG);
$('clear').addEventListener('click', clearAll);
$('cacheClear').addEventListener('click', async () => {
  try {
    await cacheWipe();
    cacheNote(t('priv.cleared'));
  } catch (e){ console.warn(e); cacheNote(t('priv.clearFail')); }
  refreshPrivacy();
});
$('demo').addEventListener('click', loadDemo);
$('privToggle').addEventListener('click', () => {
  const box = $('privDetails'), pokaz = box.hidden;
  box.hidden = !pokaz;
  $('privToggle').setAttribute('aria-expanded', String(pokaz));
  if (pokaz) refreshPrivacy();
  syncPanelHeight();
});
// Wyłączenie zapamiętywania musi też USUNĄĆ to, co już leży na dysku — inaczej przełącznik
// obiecuje prywatność, której nie dowozi.
$('remember').addEventListener('change', async e => {
  const on = e.target.checked;
  localStorage.setItem(REMEMBER_PREF, on ? '1' : '0');
  if (!on){
    try { await cacheWipe(); cacheNote(t('priv.offCleared')); }
    catch (err){ console.warn(err); cacheNote(t('priv.offFail')); }
  } else {
    cacheNote(SEGMENTS.length
      ? t('priv.onNext')
      : t('priv.onFuture'));
  }
  refreshPrivacy();
});
$('remember').checked = rememberOn();
refreshPrivacy();

$('dFrom').addEventListener('input', () => {
  const from = $('dFrom'), to = $('dTo');
  if (+from.value > +to.value) to.value = from.value;
  setDateLabels(); applyFilter();
});
$('dTo').addEventListener('input', () => {
  const from = $('dFrom'), to = $('dTo');
  if (+to.value < +from.value) from.value = to.value;
  setDateLabels(); applyFilter();
});
$('dtFrom').addEventListener('change', () => {
  const i = dayIndexFromDateStr($('dtFrom').value);
  if (i == null){ setDateLabels(); return; }            // pusta/niepełna data — przywróć poprzednią
  $('dFrom').value = String(i);
  if (+$('dTo').value < i) $('dTo').value = String(i);
  setDateLabels(); applyFilter();
});
$('dtTo').addEventListener('change', () => {
  const i = dayIndexFromDateStr($('dtTo').value);
  if (i == null){ setDateLabels(); return; }
  $('dTo').value = String(i);
  if (+$('dFrom').value > i) $('dFrom').value = String(i);
  setDateLabels(); applyFilter();
});
$('resetDates').addEventListener('click', () => { initDateSliders(); applyFilter(); });
$('tlPlay').addEventListener('click', () => { if (TL) stopTimelapse(true); else startTimelapse(); });
$('statDiam').addEventListener('click', () => toggleMeasure('diam'));
$('statConn').addEventListener('click', () => toggleMeasure('conn'));
$('statTrip').addEventListener('click', () => toggleRecord('trip'));
$('statDay').addEventListener('click', () => toggleRecord('day'));
$('qTrip').addEventListener('click', () => toggleRecord('trip'));
$('monthChart').addEventListener('click', (e) => {
  if (!CHART) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const plotW = rect.width - AX_W;
  if (plotW <= 0) return;
  const x = e.clientX - rect.left - AX_W;
  if (x < 0) return;                       // kliknięcie w oś, nie w słupek
  const i = Math.floor(x / (plotW / CHART.bars.length));
  toggleChartBar(Math.max(0, Math.min(CHART.bars.length - 1, i)));
});

// ---------- Zastosowanie języka ----------
// Teksty statyczne siedzą w atrybutach data-i18n, więc przełączenie języka nie wymaga
// przeładowania strony — a wszystko, co narysowane (wykresy, lista krajów, statystyki)
// trzeba przerysować, bo etykiety powstały w poprzednim języku.
// Zamiast „nie znaleziono żadnych tras" — co konkretnie było w plikach i czego zabrakło.
// Pokazywane też przy częściowym sukcesie, żeby pominięte pliki nie znikały po cichu.
function showLoadIssues(){
  const box = document.getElementById('loadIssues');
  const d = DIAG;
  if (!d){ box.hidden = true; return; }
  const punkty = [];
  const lista = arr => '<ul><li><code>' + arr.map(x => String(x)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')).join('</code></li><li><code>') + '</code></li></ul>';
  if (d.obce.length)    punkty.push(t('diag.foreign', d.obce.length) + lista(d.obce));
  if (d.zleJson.length) punkty.push(t('diag.badJson', d.zleJson.length) + lista(d.zleJson));
  if (d.nieznane.length)punkty.push(t('diag.unknown', d.nieznane.length) + lista(d.nieznane));
  if (d.puste.length)   punkty.push(t('diag.emptyZip') + lista(d.puste));
  const sukces = SEGMENTS.length > 0;
  if (sukces && !punkty.length){ box.hidden = true; return; }
  if (!sukces && !punkty.length){
    // pliki rozpoznane, ale bez użytecznych punktów — to inny problem niż zły plik
    punkty.push(d.ok ? t('diag.recognisedEmpty') : t('diag.nothing'));
  }
  box.hidden = false;
  box.className = sukces ? 'ok' : '';
  box.innerHTML = '<b>' + (sukces ? t('diag.partialHdr') : t('diag.failHdr')) + '</b><br>'
                + punkty.join('') + '<div style="margin-top:8px">' + t('diag.hint') + '</div>';
  syncPanelHeight();
}
function updateDupNote(){
  const el = document.getElementById('dupNote'); if (!el) return;
  el.textContent = SEGMENTS.length
    ? (DUP_COUNT ? t('dup.found', num(DUP_COUNT), fmtKm(DUP_KM*1000)) + ' ' + t('dup.expl')
                 : t('dup.none'))
    : '';
  document.getElementById('dupRow').style.display = DUP_COUNT ? '' : 'none';
}
function applyI18n(){
  document.documentElement.lang = LANG;
  for (const el of document.querySelectorAll('[data-i18n]'))
    el.textContent = t(el.getAttribute('data-i18n'));
  for (const el of document.querySelectorAll('[data-i18n-html]'))
    el.innerHTML = t(el.getAttribute('data-i18n-html'));
  $('lang').value = LANG;
  $('busyTxt').textContent = t('busy.default');
  $('panelToggle').textContent = document.body.classList.contains('panelHidden')
    ? t('panel.open') : t('panel.close');
  if (!TL){ $('tlPlay').textContent = t('tl.play'); $('tlLbl').textContent = t('tl.hint'); }
  updateDupNote();
  applyStyleMode(styleMode, true);
}
function setLang(kod){
  if (!I18N[kod] || kod === LANG) return;
  LANG = kod;
  LOCALE = LANG === 'pl' ? 'pl-PL' : 'en-GB';
  localStorage.setItem(LANG_PREF, kod);
  applyI18n();
  renderCountryList();
  refreshPrivacy();
  if (SEGMENTS.length){
    buildModeRows();              // nazwy środków transportu
    applyFilter();                // statystyki, wykresy i etykiety pod nimi
  }
}
$('lang').addEventListener('change', e => setLang(e.target.value));
applyI18n();

const EXT_POI = [
  ['gxN','n','geo.n'], ['gxS','s','geo.s'],
  ['gxE','e','geo.e'], ['gxW','w','geo.w'],
  ['gxC','centroid','geo.c'],
];
for (const [id, key, labelKey] of EXT_POI){
  $(id).addEventListener('click', () => {
    const p = GEO.ext && GEO.ext[key];
    if (p) showPoint(p, t(labelKey));      // etykieta liczona przy kliknięciu, więc zgodna z językiem
  });
}
</script>
