<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Google Timeline Heatmap</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
  :root { --bg:#0d0f13; --panel:#171a21; --panel2:#1f232c; --txt:#e7ebf0; --muted:#98a2b3; --accent:#ff7a1a; }
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--txt);
              overscroll-behavior:none;   /* przeciąganie mapy nie ma odświeżać strony na telefonie */
              font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
  #map { position:absolute; inset:0; background:var(--bg); }
  a { color:var(--accent); }

  #panel {
    position:absolute; top:12px; left:12px; z-index:1000; width:312px; max-width:calc(100vw - 24px);
    background:rgba(23,26,33,.94); backdrop-filter:blur(8px); border:1px solid #2a2f3a;
    border-radius:14px; padding:14px 14px 12px; box-shadow:0 10px 30px rgba(0,0,0,.5);
    max-height:calc(100vh - 24px); overflow:auto;
  }
  #panel h1 { font-size:15px; margin:0 0 2px; letter-spacing:.2px; }
  #panel .sub { font-size:11px; color:var(--muted); margin-bottom:12px; }

  /* to <label>, więc bez display:block zwija się do szerokości tekstu zamiast zająć panel */
  .drop {
    display:block;
    border:1.5px dashed #3a4150; border-radius:10px; padding:16px 12px; text-align:center;
    cursor:pointer; transition:.15s; background:var(--panel2); font-size:13px; color:var(--muted);
  }
  /* główne wejście dla kogoś, kto nie ma jeszcze pliku — nie może być drobnym linkiem */
  #demo { width:100%; margin-top:8px; }
  .drop:hover, .drop.over { border-color:var(--accent); color:var(--txt); background:#232833; }
  .drop b { color:var(--txt); }
  input[type=file]{ display:none; }

  .section { font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:#6b7482;
             margin:16px 0 6px; display:flex; align-items:center; justify-content:space-between; }
  .section .tgl { text-transform:none; letter-spacing:0; color:var(--muted); font-size:11px;
                  display:flex; align-items:center; gap:5px; cursor:pointer; }

  .row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:10px 0 4px; font-size:12px; }
  .row label { color:var(--muted); }
  .row .val { color:var(--txt); font-variant-numeric:tabular-nums; min-width:38px; text-align:right; }
  input[type=range]{ width:100%; accent-color:var(--accent); }
  input[type=color]{ width:34px; height:24px; border:none; background:none; padding:0; cursor:pointer; }
  input[type=checkbox]{ accent-color:var(--accent); }

  .btns { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  button {
    flex:1; min-width:84px; background:var(--panel2); color:var(--txt); border:1px solid #2f3542;
    border-radius:9px; padding:8px 10px; font-size:12px; cursor:pointer; transition:.12s;
  }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#1a0f04; font-weight:600; }
  button.mini { flex:none; width:100%; margin-top:6px; padding:6px; font-size:11px; }
  /* przycisk wyglądający jak odnośnik — rozwija wyjaśnienie, nie wykonuje akcji */
  button.linkish {
    width:auto; flex:none; min-width:0; margin-top:8px; padding:0; border:none; background:none;
    color:var(--muted); font-size:10.5px; text-decoration:underline; text-underline-offset:2px;
  }
  button.linkish:hover { color:var(--accent); border:none; }
  /* Diagnostyka wczytywania — ma się rzucać w oczy, bo pojawia się tylko wtedy,
     gdy coś poszło nie tak i użytkownik musi wiedzieć co. */
  #loadIssues {
    margin-top:10px; padding:10px 11px; border-radius:9px; font-size:11px; line-height:1.65;
    background:#2a1d12; border:1px solid #5a3a1c; color:#e7c9a6;
  }
  #loadIssues.ok { background:#16241a; border-color:#2c4a33; color:#bcd9c4; }
  #loadIssues b { color:#fff; }
  #loadIssues ul { margin:6px 0 0; padding-left:16px; }
  #loadIssues code { font-family:ui-monospace,Consolas,monospace; font-size:10.5px; color:#fff; }
  #privDetails p { margin:0 0 8px; }
  #privDetails b { color:var(--txt); }

  select {
    width:100%; background:var(--panel2); color:var(--txt); border:1px solid #2f3542;
    border-radius:9px; padding:7px 8px; font-size:12px; margin-top:4px;
  }
  .row select { width:auto; margin-top:0; }

  /* Zakres dat */
  .daterow { display:flex; align-items:center; justify-content:space-between; font-size:12px; margin:8px 0 2px; }
  .daterow span { color:var(--muted); }
  .dateInput {
    color-scheme:dark;                    /* natywny kalendarz w ciemnym wariancie */
    background:var(--panel2); color:var(--txt); border:1px solid #2f3542; border-radius:7px;
    padding:3px 6px; font-size:12px; font-family:inherit; font-variant-numeric:tabular-nums;
  }
  .dateInput:hover { border-color:#3a4150; }
  .dateInput:focus { outline:none; border-color:var(--accent); }

  /* Środki transportu */
  .modeRow { display:flex; align-items:center; gap:8px; padding:5px 0; font-size:12px; cursor:pointer; }
  .modeRow .sw { width:11px; height:11px; border-radius:3px; flex:none; }
  .modeRow .mName { flex:1; }
  .modeRow .mKm { color:var(--muted); font-variant-numeric:tabular-nums; }
  .modeRow input { margin:0; }
  .modeRow.off { opacity:.4; }

  /* Statystyki */
  #stats { margin-top:14px; border-top:1px solid #262b35; padding-top:12px; }
  .statBig { font-size:26px; font-weight:700; letter-spacing:.3px; font-variant-numeric:tabular-nums; }
  .statBig small { display:block; font-size:10.5px; font-weight:400; color:var(--muted);
                   letter-spacing:.4px; text-transform:uppercase; margin-top:1px; }
  .statGrid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0 6px; }
  .statGrid > div { background:var(--panel2); border:1px solid #262b35; border-radius:9px; padding:8px 10px; }
  .statGrid b { font-size:16px; font-variant-numeric:tabular-nums; }
  .statGrid span { display:block; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
  .statGrid > div.clickable { cursor:pointer; transition:.12s; }
  .statGrid > div.clickable:hover { border-color:#3a4150; background:#252b36; }
  .statGrid > div.clickable.active { border-color:var(--accent); background:rgba(255,122,26,.14); }
  .statGrid > div.clickable.active b { color:var(--accent); }
  .statGrid > div.clickable.active span::before { content:'● '; color:var(--accent); font-size:9px; }
  .metaLine { font-size:10.5px; color:#6b7482; line-height:1.6; margin-top:10px; }
  .metaLine b { color:var(--muted); font-variant-numeric:tabular-nums; }
  .spanStats { margin:4px 0 2px; }
  .spanStat { display:flex; justify-content:space-between; align-items:baseline; gap:10px;
              padding:7px 0; border-bottom:1px solid #20242d; font-size:11.5px; }
  .spanStat span { color:var(--muted); }
  .spanStat b { font-size:14px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .spanStat.clickable { cursor:pointer; transition:.12s; }
  .spanStat.clickable:hover { color:var(--txt); }
  .spanStat.clickable:hover span { color:var(--txt); }
  .spanStat.active b { color:var(--accent); }
  .spanStat.active span::before { content:'● '; color:var(--accent); font-size:9px; vertical-align:middle; }
  /* Przy kilkudziesięciu krajach lista wypchnęłaby wykresy poza zasięg wzroku */
  #countryList { max-height:240px; overflow-y:auto; overscroll-behavior:contain; }
  .measureHint { font-size:10px; color:#5b636f; margin-top:5px; }
  .measure-tip { background:#11141a; color:#fff; border:1px solid #3a4150; border-radius:6px;
                 font-size:11px; font-weight:600; padding:3px 7px; box-shadow:0 2px 8px rgba(0,0,0,.5); }
  .measure-tip::before { display:none; }
  .chart { width:100%; display:block; background:var(--panel2); border:1px solid #262b35;
           border-radius:9px; margin-top:2px; }
  #monthChart { cursor:pointer; }
  .chartLbl { font-size:9.5px; color:#5b636f; margin-top:4px; line-height:1.4; }
  .spdDot { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:6px; vertical-align:middle; }
  .statGrid b[title] { cursor:help; }

  /* Pasek najważniejszych statystyk (dół ekranu) */
  #quickBar {
    position:absolute; left:50%; bottom:14px; transform:translateX(-50%); z-index:1000;
    display:flex; align-items:stretch; max-width:calc(100vw - 24px); overflow-x:auto;
    background:rgba(23,26,33,.94); backdrop-filter:blur(8px); border:1px solid #2a2f3a;
    border-radius:14px; box-shadow:0 10px 30px rgba(0,0,0,.5); padding:10px 6px;
  }
  #quickBar .qItem { display:flex; flex-direction:column; align-items:center; justify-content:center;
                      padding:2px 18px; white-space:nowrap; }
  #quickBar .qItem b { font-size:19px; font-weight:700; letter-spacing:.2px; font-variant-numeric:tabular-nums; }
  #quickBar .qItem span { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; margin-top:2px; }
  #quickBar .qSep { width:1px; background:#2a2f3a; margin:2px 0; flex:none; }
  #quickBar .qItem.clickable { cursor:pointer; transition:.12s; border-radius:8px; }
  #quickBar .qItem.clickable:hover { background:#20242e; }
  #quickBar .qItem.clickable.active b { color:var(--accent); }
  #quickBar .qItem.clickable.active { background:rgba(255,122,26,.12); }
  /* Przełącznik panelu — tylko na wąskich ekranach, w prawym górnym rogu
     (lewy górny zajmuje sterowanie zoomem Leafletu). */
  #panelToggle {
    display:none; position:absolute; top:12px; right:12px; z-index:1001;
    width:auto; flex:none; min-width:0; padding:10px 14px; font-size:13px; font-weight:600;
    background:rgba(23,26,33,.94); backdrop-filter:blur(8px); border:1px solid #2a2f3a;
    border-radius:12px; box-shadow:0 6px 20px rgba(0,0,0,.5);
  }

  @media (max-width: 680px) {
    #quickBar { left:10px; right:10px; bottom:calc(10px + env(safe-area-inset-bottom));
                transform:none; justify-content:flex-start; scrollbar-width:none; }
    #quickBar::-webkit-scrollbar { display:none; }
    #quickBar .qItem { padding:2px 12px; }
    #quickBar .qItem b { font-size:15px; }

    #panelToggle { display:block; }
    #panel { left:10px; right:10px; top:10px; width:auto; max-width:none; padding:12px 12px 10px; }
    #panel h1, #panel .sub { padding-right:88px; }   /* miejsce na przycisk „Zamknij" nad panelem */
    body.panelHidden #panel { display:none; }

    /* palec to nie kursor — większe cele dotykowe */
    input[type=range] { height:30px; }
    .modeRow { padding:9px 0; font-size:13px; }
    .dateInput { padding:7px 9px; font-size:14px; }
    select { padding:9px 10px; font-size:13px; }
    button { padding:11px 10px; font-size:13px; }
    button.mini { padding:9px; font-size:12px; }
    .spanStat { padding:10px 0; }
    .drop { padding:22px 12px; }
    .chart { touch-action:manipulation; }   /* bez opóźnienia 300 ms przy stuknięciu w słupek */
  }

  #busy {
    position:absolute; inset:0; z-index:2000; display:none; place-items:center;
    background:rgba(8,9,12,.72); backdrop-filter:blur(2px);
  }
  #busy .box { background:var(--panel); border:1px solid #2a2f3a; border-radius:12px;
               padding:20px 26px; text-align:center; font-size:13px; }
  .spin { width:26px; height:26px; border:3px solid #333; border-top-color:var(--accent);
          border-radius:50%; margin:0 auto 12px; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .leaflet-container { background:var(--bg); }
  /* to jedyna podpowiedź dla kogoś, kto nie ma jeszcze pliku — ma być widoczna bez szukania */
  details summary { cursor:pointer; font-size:12.5px; font-weight:600; color:var(--txt); margin-top:12px; }
  details summary:hover { color:var(--accent); }
  details[open] summary { margin-bottom:2px; }
</style>
</head>
<body>
<div id="map"></div>

<button id="panelToggle" aria-expanded="true">Ustawienia</button>

<div id="panel">
  <h1>Timeline Heatmap</h1>
  <div class="sub" data-i18n="app.sub"></div>

  <select id="lang" aria-label="Language">
    <option value="en">English</option>
    <option value="pl">Polski</option>
  </select>

  <label class="drop" id="drop">
    <span data-i18n-html="drop.main"></span><br>
    <span style="font-size:11px" data-i18n="drop.sub"></span>
    <input type="file" id="file" accept=".json,.zip" multiple />
  </label>
  <button id="demo" data-i18n="demo.btn"></button>

  <details id="help">
    <summary data-i18n="help.summary"></summary>
    <div class="metaLine" style="margin-top:8px" data-i18n-html="help.body"></div>
  </details>

  <label class="modeRow" id="rememberRow">
    <input type="checkbox" id="remember">
    <span class="mName" data-i18n="remember.label"></span>
  </label>
  <div class="metaLine" id="cacheNote"></div>
  <div id="loadIssues" hidden></div>

  <button id="privToggle" class="linkish" aria-expanded="false" aria-controls="privDetails"
          data-i18n="priv.toggle"></button>
  <div class="metaLine" id="privDetails" hidden>
    <p data-i18n-html="priv.p1"></p>
    <p data-i18n-html="priv.p2"></p>
    <p id="privStored"></p>
    <button id="cacheClear" class="mini" data-i18n="priv.clear"></button>
  </div>

  <div id="controls" style="display:none">
    <div class="section" data-i18n="sec.style"></div>
    <div class="row"><label data-i18n="style.mode"></label>
      <select id="styleMode">
        <option value="heat" data-i18n="style.heat"></option>
        <option value="lines" data-i18n="style.lines"></option>
      </select>
    </div>
    <div class="metaLine" id="styleHint"></div>

    <label class="modeRow" id="dupRow">
      <input type="checkbox" id="hideDup" checked>
      <span class="mName" data-i18n="dup.label"></span>
    </label>
    <div class="metaLine" id="dupNote"></div>

    <div class="row"><label data-i18n="style.color"></label>
      <input type="color" id="color" value="#ff7a1a" /></div>

    <div class="row"><label id="opLbl"></label><span class="val" id="opVal">0.14</span></div>
    <input type="range" id="opacity" min="0.02" max="1" step="0.01" value="0.14" />

    <div class="row"><label data-i18n="style.weight"></label><span class="val" id="wVal">1.6</span></div>
    <input type="range" id="weight" min="0.5" max="6" step="0.1" value="1.6" />

    <div class="section"><span data-i18n="sec.modes"></span>
      <label class="tgl"><input type="checkbox" id="colorByMode" /> <span data-i18n="modes.byMode"></span></label>
    </div>
    <div id="modes"></div>

    <div class="section" data-i18n="sec.dates"></div>
    <div class="daterow"><span data-i18n="dates.from"></span><input type="date" id="dtFrom" class="dateInput" /></div>
    <input type="range" id="dFrom" min="0" max="0" value="0" step="1" />
    <div class="daterow"><span data-i18n="dates.to"></span><input type="date" id="dtTo" class="dateInput" /></div>
    <input type="range" id="dTo" min="0" max="0" value="0" step="1" />
    <button id="resetDates" class="mini" data-i18n="dates.all"></button>

    <div class="section" data-i18n="sec.timelapse"></div>
    <div class="row"><label data-i18n="tl.dur"></label>
      <select id="tlDur">
        <option value="10">10 s</option>
        <option value="20" selected>20 s</option>
        <option value="45">45 s</option>
        <option value="90">90 s</option>
      </select>
    </div>
    <button id="tlPlay" class="mini"></button>
    <div class="chartLbl" id="tlLbl"></div>

    <div class="section" data-i18n="sec.basemap"></div>
    <select id="basemap">
      <option value="dark" data-i18n="bm.dark"></option>
      <option value="light" data-i18n="bm.light"></option>
      <option value="sat" data-i18n="bm.sat"></option>
      <option value="none" data-i18n="bm.none"></option>
    </select>
    <label class="modeRow" style="margin-top:8px">
      <input type="checkbox" id="showCountries">
      <span class="mName" data-i18n="bm.countries"></span>
    </label>

    <div class="btns">
      <button id="fit" class="primary" data-i18n="btn.fit"></button>
      <button id="png" data-i18n="btn.png"></button>
      <button id="clear" data-i18n="btn.clear"></button>
    </div>
  </div>

  <div id="stats" style="display:none">
    <div class="section" data-i18n="sec.visits"></div>
    <div class="statGrid">
      <div><b id="stHome">0</b><span data-i18n="st.home"></span></div>
      <div><b id="stWork">0</b><span data-i18n="st.work"></span></div>
    </div>
    <div class="section" data-i18n="sec.spanRec"></div>
    <div class="spanStats">
      <div class="spanStat clickable" id="statDiam"><span data-i18n="span.diam"></span><b id="stDiam">—</b></div>
      <div class="spanStat clickable" id="statConn"><span data-i18n="span.conn"></span><b id="stConn">—</b></div>
      <div class="measureHint" data-i18n="span.hint"></div>
    </div>

    <div class="section" data-i18n="sec.records"></div>
    <div class="statGrid">
      <div class="clickable" id="statTrip"><b id="rTrip">—</b><span data-i18n="rec.trip"></span></div>
      <div class="clickable" id="statDay"><b id="rDay" title="">—</b><span data-i18n="rec.day"></span></div>
      <div><b id="rStreak">—</b><span data-i18n="rec.streak"></span></div>
      <div><b id="rMonth" title="">—</b><span data-i18n="rec.month"></span></div>
    </div>
    <div class="metaLine" id="recordHint" data-i18n="rec.hint"></div>

    <div class="section" data-i18n="sec.geo"></div>
    <div class="spanStats">
      <div class="spanStat clickable" id="gxN"><span data-i18n="geo.n"></span><b id="gN">—</b></div>
      <div class="spanStat clickable" id="gxS"><span data-i18n="geo.s"></span><b id="gS">—</b></div>
      <div class="spanStat clickable" id="gxE"><span data-i18n="geo.e"></span><b id="gE">—</b></div>
      <div class="spanStat clickable" id="gxW"><span data-i18n="geo.w"></span><b id="gW">—</b></div>
      <div class="spanStat clickable" id="gxC"><span data-i18n="geo.c"></span><b id="gC">—</b></div>
      <div class="spanStat"><span data-i18n="geo.cells"></span><b id="gCells">—</b></div>
    </div>

    <div class="section"><span data-i18n="sec.countries"></span> <span class="tgl" id="ccCount">—</span></div>
    <div class="spanStats" id="countryList"></div>
    <div class="metaLine" data-i18n="cc.hint"></div>

    <div class="section" data-i18n="sec.speed"></div>
    <div id="speedRows"></div>

    <div class="section" data-i18n="sec.when"></div>
    <canvas id="dowHour" class="chart"></canvas>
    <div class="chartLbl" data-i18n="when.hint"></div>

    <div class="section" id="chTimeHdr"></div>
    <canvas id="monthChart" class="chart"></canvas>
    <div class="chartLbl" id="monthLbl">—</div>

    <div class="section" data-i18n="sec.fun"></div>
    <div class="spanStats">
      <div class="spanStat"><span data-i18n="fun.pl"></span><b id="funPL">—</b></div>
      <div class="spanStat"><span data-i18n="fun.eq"></span><b id="funEq">—</b></div>
      <div class="spanStat"><span data-i18n="fun.moon"></span><b id="funMoon">—</b></div>
      <div class="spanStat"><span data-i18n="fun.co2"></span><b id="funCO2">—</b></div>
    </div>

    <div class="metaLine">
      <span data-i18n="meta.range"></span><b id="stRange">—</b><br>
      <span data-i18n="meta.seg"></span><b id="sSeg">0</b> · <span data-i18n="meta.pts"></span><b id="sPts">0</b>
      · <span data-i18n="meta.files"></span><b id="sFiles">0</b><br>
      <span data-i18n="meta.fmt"></span><b id="sFmt">—</b>
    </div>
  </div>

</div>

<div id="quickBar" style="display:none">
  <div class="qItem"><b id="stDist">0 km</b><span id="stDistLbl"></span></div>
  <div class="qSep"></div>
  <div class="qItem"><b id="stTrips">0</b><span data-i18n="q.trips"></span></div>
  <div class="qSep"></div>
  <div class="qItem"><b id="stDays">0</b><span data-i18n="q.days"></span></div>
  <div class="qSep"></div>
  <div class="qItem clickable" id="qTrip"><b id="qTripVal">—</b><span data-i18n="q.longest"></span></div>
  <div class="qSep"></div>
  <div class="qItem"><b id="gCountries">—</b><span data-i18n="q.countries"></span></div>
  <div class="qSep"></div>
  <div class="qItem"><b id="gArea">—</b><span data-i18n="q.area"></span></div>
</div>

function detectLang(){
  const zap = localStorage.getItem(LANG_PREF);
  if (zap && I18N[zap]) return zap;
  return (navigator.language || '').toLowerCase().startsWith('pl') ? 'pl' : 'en';
}
let LANG = detectLang();
let LOCALE = LANG === 'pl' ? 'pl-PL' : 'en-GB';
function t(key, ...args){
  const s = (I18N[LANG] && I18N[LANG][key]) ?? I18N.en[key] ?? key;
  return typeof s === 'string' ? s.replace(/\{(\d)\}/g, (_, i) => args[i] ?? '') : s;
}
function num(v){ return v.toLocaleString(LOCALE); }

function activityToMode(type){
  if (!type) return 'unknown';
  type = String(type).toUpperCase();
  if (/PASSENGER_VEHICLE|IN_VEHICLE|DRIV|MOTORCYCL|\bCAR\b|TAXI/.test(type)) return 'car';
  if (/WALK|ON_FOOT|RUNNING|HIKING|\bFOOT\b/.test(type))                    return 'walk';
  if (/CYCL|\bBIK/.test(type))                                             return 'bike';
  if (/FLY|FLIGHT|AIRPLANE|AEROPLANE|\bPLANE\b/.test(type))                return 'flight';
  if (/BUS|TRAM|TRAIN|SUBWAY|METRO|FERR|BOAT|SAIL|TRANSIT/.test(type))     return 'transit';
  return 'unknown';
}
// Reklasyfikacja: aktywność o niemożliwym dla lądu dystansie/prędkości to lot
function refineMode(mode, distM, t0, t1){
  if (mode === 'flight') return mode;
  const km = distM/1000;
  let kmh = 0;
  if (Number.isFinite(t0) && Number.isFinite(t1) && t1 > t0) kmh = km / ((t1-t0)/3600000);
  if (km > 1500 || kmh > 300) return 'flight';
  return mode;
}

// ---------- Mapa i podkłady ----------
// Widok startowy obejmuje cały świat — dane mogą być z dowolnego miejsca.
// Po wczytaniu i tak przejmuje go fitToData().
const map = L.map('map', { preferCanvas: true, zoomControl: true, worldCopyJump: true })
             .setView([20, 0], 2);

const TILES = {
  dark:  { url:'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
           opt:{ subdomains:'abcd', maxZoom:20, crossOrigin:'anonymous',
                 attribution:'&copy; OpenStreetMap &copy; CARTO' } },
  light: { url:'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
           opt:{ subdomains:'abcd', maxZoom:20, crossOrigin:'anonymous',
                 attribution:'&copy; OpenStreetMap &copy; CARTO' } },
  sat:   { url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
           opt:{ maxZoom:19, crossOrigin:'anonymous', attribution:'Tiles &copy; Esri' } },
};
let baseLayer = null, curBasemap = 'dark';
function setBasemap(key){
  curBasemap = key;
  if (baseLayer){ map.removeLayer(baseLayer); baseLayer = null; }
  if (key === 'none'){ document.getElementById('map').style.background = '#000'; return; }
  document.getElementById('map').style.background = 'var(--bg)';
  const t = TILES[key];
  baseLayer = L.tileLayer(t.url, t.opt).addTo(map);
  baseLayer.bringToBack();
}
setBasemap('dark');

// Ile pikseli fizycznych na piksel CSS. Ograniczone do 2 — telefony z DPR 3 malowałyby
// 2,25× więcej pikseli bez widocznego zysku, a to najcięższa część rysowania śladu.
function renderScale(){ return Math.min(window.devicePixelRatio || 1, 2); }

// ---------- Custom warstwa: additywne linie (efekt Strava) ----------
L.HeatLines = L.Layer.extend({
  options: { color:'#ff7a1a', opacity:0.14, weight:1.6, additive:true },
  initialize(segments, options){
    this._segments = segments || [];
    this._filter = null;          // {from, to, modes:Set}
    this._colorByMode = false;
    this._hideDup = true;         // zgodnie z domyślnym stanem pola wyboru w panelu
    L.setOptions(this, options);
    this._updateStyles();
  },
  setSegments(segments){
    this._segments = segments;
    if (this._map){ this._projectAll(); this._redraw(); }
    return this;
  },
  // Rzutowanie lat/lng na piksele to najdroższa część rysowania — przy 218 tys. punktów
  // liczone od nowa na każdą klatkę dławi mapę po każdym zoomie. Projekcja Leafletu jest
  // w skali liniowa, więc wystarczy policzyć piksele raz dla zoomu 0; dla każdego innego
  // zoomu to już tylko mnożenie przez 2^zoom. Float64, bo przy zoomie 20 float32 gubiłby
  // kilka pikseli.
  _project(seg){
    const c = seg.c, n = c.length, p = new Float64Array(n), map = this._map;
    for (let i = 0; i < n; i += 2){
      const q = map.project([c[i], c[i+1]], 0);
      p[i] = q.x; p[i+1] = q.y;
    }
    return (seg.p0 = p);
  },
  _projectAll(){ for (const seg of this._segments) if (!seg.p0) this._project(seg); },
  setStyle(o){ L.setOptions(this, o); this._updateStyles(); if (this._map) this._redraw(); return this; },
  setFilter(f){ this._filter = f; if (this._map) this._redraw(); return this; },
  // Timelapse: ślad wyłącznie narasta, więc zamiast czyścić kanwę i rzutować wszystkie punkty
  // od nowa, dorysowujemy same odcinki odsłonięte od poprzedniej klatki. Przy additywnym
  // blendingu to zarazem jedyny poprawny sposób — ponowne narysowanie odcinka by go rozjaśniło.
  extendFilterTo(to){
    const F = this._filter;
    if (!F) return this.setFilter({ from:-Infinity, to });
    const prev = F.to;
    // Zaległe raty trzeba dokończyć JESZCZE ze starą górną granicą — inaczej dorysowałyby
    // odcinki z przyrostu, a chwilę później zrobiłby to drugi raz przebieg różnicowy.
    this._finishChunks();
    F.to = to;
    if (this._map && to > prev){
      const ctx = this._offCtx, s = this._scale || 1;
      ctx.setTransform(s,0,0,s,0,0);
      this._paint(ctx, prev, 0, 0, this._view);   // ten sam układ, co reszta zawartości kanwy
      this._commit();
    }
    return this;
  },
  setColorByMode(b){ this._colorByMode = b; if (this._map) this._redraw(); return this; },
  setHideDup(b){ this._hideDup = b; if (this._map) this._redraw(); return this; },
  _updateStyles(){
    this._single = hexToRgba(this.options.color, this.options.opacity);
    this._modeStyle = {};
    for (const k in MODE_COLOR) this._modeStyle[k] = hexToRgba(MODE_COLOR[k], this.options.opacity);
  },

  onAdd(map){
    this._map = map;
    if (!this._canvas) this._initCanvas();
    map.getPanes().overlayPane.appendChild(this._canvas);
    map.on('moveend', this._reset, this);
    map.on('resize',  this._reset, this);
    // W trakcie gestu nie ma po co dorysowywać widoku, który zaraz się zmieni — przerwane
    // raty zwalniają procesor na płynne przesuwanie, a moveend i tak zaczyna rysowanie od nowa.
    map.on('movestart zoomstart', this._cancelChunks, this);
    if (map.options.zoomAnimation && L.Browser.any3d) map.on('zoomanim', this._animateZoom, this);
    this._reset();
  },
  onRemove(map){
    if (this._canvas && this._canvas.parentNode) this._canvas.parentNode.removeChild(this._canvas);
    this._cancelChunks();
    map.off('moveend', this._reset, this);
    map.off('resize',  this._reset, this);
    map.off('movestart zoomstart', this._cancelChunks, this);
    map.off('zoomanim', this._animateZoom, this);
  },
  _initCanvas(){
    const canvas = this._canvas = L.DomUtil.create('canvas', 'leaflet-heatlines leaflet-layer');
    const animated = this._map.options.zoomAnimation && L.Browser.any3d;
    L.DomUtil.addClass(canvas, 'leaflet-zoom-' + (animated ? 'animated' : 'hide'));
    this._ctx = canvas.getContext('2d');
    // Kanwa robocza, poza drzewem dokumentu: cały ślad powstaje na niej, a na widoczną
    // trafia dopiero gotowy. Dzięki temu nie widać narastania, a przez czas rysowania
    // na ekranie zostaje poprzedni obraz — Leaflet trzyma go w miejscu transformacją,
    // więc jest geograficznie poprawny, tylko przy zoomie chwilowo mniej ostry.
    this._off = document.createElement('canvas');
    this._offCtx = this._off.getContext('2d');
    this._sizeCanvas();
  },
  // Kanwa ma tyle pikseli, ile ma ekran (retina/telefon), a rozmiar CSS w px logicznych —
  // bez tego przeglądarka rozciąga obraz 1x i ślad jest rozmyty.
  _sizeCanvas(){
    const size = this._map.getSize(), s = renderScale();
    const w = Math.round(size.x*s), h = Math.round(size.y*s);
    const off = this._off;
    if (off.width !== w || off.height !== h){ off.width = w; off.height = h; }
    this._scale = s;
    this._cssSize = size;
  },
  // Przenosi gotowy obraz na widoczną kanwę i dopiero teraz ustawia ją w nowym miejscu.
  // Kolejność jest istotna: przestawienie kanwy przed gotowym obrazem pokazałoby
  // starą zawartość w nowym położeniu, czyli ślad rozjechany z podkładem.
  _commit(){
    const v = this._view; if (!v || this._pusto()) return;
    const cv = this._canvas, off = this._off;
    L.DomUtil.setPosition(cv, v.topLeft);
    if (cv.width !== off.width || cv.height !== off.height){ cv.width = off.width; cv.height = off.height; }
    cv.style.width = v.cssW+'px'; cv.style.height = v.cssH+'px';
    const ctx = this._ctx;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.globalCompositeOperation = 'copy';        // zastąp, nie domaluj — bez czyszczenia osobno
    ctx.drawImage(off, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
  },
  _animateZoom(e){
    const scale = this._map.getZoomScale(e.zoom);
    const offset = this._map._getCenterOffset(e.center)._multiplyBy(-scale)
                     .subtract(this._map._getMapPanePos());
    if (L.DomUtil.setTransform) L.DomUtil.setTransform(this._canvas, offset, scale);
    else this._canvas.style[L.DomUtil.TRANSFORM] =
           L.DomUtil.getTranslateString(offset) + ' scale(' + scale + ')';
  },
  // Dopasowuje POPRZEDNI obraz do bieżącego widoku mapy. Leaflet po zakończeniu zoomu
  // zeruje przesunięcie panelu mapy, więc transformacja z animacji przestaje pasować
  // i stary ślad podskoczyłby. Liczymy ją od nowa: piksel starej kanwy odpowiada temu
  // samemu miejscu na Ziemi, wystarczy przeskalować o stosunek zoomów i przesunąć.
  _realign(){
    const v = this._view; if (!v) return;
    const map = this._map, k = Math.pow(2, map.getZoom());
    const po = map.getPixelOrigin(), pp = map._getMapPanePos();
    const r = k / v.k;
    const dx = v.ox * r - (po.x - pp.x), dy = v.oy * r - (po.y - pp.y);
    L.DomUtil.setTransform(this._canvas, map.containerPointToLayerPoint([dx, dy]), r);
  },
  // Celowo nie ruszamy tu rozmiaru widocznej kanwy — zajmie się nim _commit,
  // gdy nowy obraz będzie gotowy.
  _reset(){ this._realign(); this._sizeCanvas(); this._redraw(); },
  redraw(){ if (this._map) this._redraw(); return this; },
  // Na gęstych danych jedno przerysowanie potrafi zająć ćwierć sekundy — zrobione w całości
  // zamraża stronę. Dzielimy je więc na porcje po ~12 ms i oddajemy sterowanie przeglądarce
  // między nimi, a rysujemy na kanwie roboczej, żeby nie było widać narastania.
  // Układ odniesienia rysowania: skala zoomu, początek warstwy i zasięg widoku.
  // Musi być policzony RAZ na całe przerysowanie — przy przeciąganiu mapy pozycja panelu
  // zmienia się w trakcie, więc raty liczone osobno rysowałyby fragmenty względem różnych
  // punktów odniesienia i ślad rozjeżdżałby się z podkładem na proste krawędzie.
  _viewParams(){
    const map = this._map, b = map.getBounds().pad(0.25), size = map.getSize();
    const po = map.getPixelOrigin(), pp = map._getMapPanePos();
    return { k: Math.pow(2, map.getZoom()), ox: po.x - pp.x, oy: po.y - pp.y,
             minLat: b.getSouth(), maxLat: b.getNorth(), minLng: b.getWest(), maxLng: b.getEast(),
             topLeft: map.containerPointToLayerPoint([0,0]), cssW: size.x, cssH: size.y };
  },
  // Kontener mapy bywa przy starcie jeszcze nierozłożony (ukryta karta, późny układ CSS)
  // i ma wtedy 0×0. Rysowanie na zerowej kanwie nie ma sensu, a odczyt z niej rzuca wyjątkiem
  // — wcześniej wywracało to cały skrypt na `const heat = ...` i aplikacja w ogóle się nie
  // uruchamiała. Leaflet i tak zawoła `resize`, gdy kontener dostanie rozmiar.
  _pusto(){ return !(this._off.width > 0 && this._off.height > 0); },
  _redraw(){
    this._cancelChunks();
    this._view = this._viewParams();
    if (this._pusto()) return;
    const ctx = this._offCtx, s = this._scale || 1;
    ctx.setTransform(s,0,0,s,0,0);
    ctx.clearRect(0,0,this._view.cssW,this._view.cssH);
    this._chunkAt = 0;
    this._chunkSize = 2048;
    this._chunkStep();
  },
  _chunkStep(){
    if (this._pusto()){ this._chunkTimer = null; return; }
    const ctx = this._offCtx, s = this._scale || 1;
    ctx.setTransform(s,0,0,s,0,0);
    const t = performance.now();
    const next = this._paint(ctx, null, this._chunkAt, this._chunkSize, this._view);
    // Chrome kolejkuje polecenia rysowania i rasteryzuje je dopiero przy odczycie kanwy:
    // sama pętla po 25 tys. odcinków trwa 9 ms, a odroczony flush 260 ms. Bez wymuszenia
    // odczytu nie zmierzylibyśmy prawdziwego kosztu raty ani nie rozłożyli go w czasie.
    ctx.getImageData(0,0,1,1);
    const ms = performance.now() - t;
    // celuj w ~12 ms na ratę; zmiana najwyżej 4× na krok, żeby rozmiar nie oscylował.
    // Odczyt kanwy sam w sobie kosztuje kilka ms, więc przy tanich widokach raty rosną
    // aż do całości — inaczej zapłacilibyśmy za sto odczytów więcej niż za rysowanie.
    const f = Math.max(0.25, Math.min(2, 12 / Math.max(ms, 0.1)));
    this._chunkSize = Math.max(256, Math.round(this._chunkSize * f));
    this._chunkAt = next;
    if (next < 0){ this._chunkTimer = null; this._commit(); }
    else this._chunkTimer = setTimeout(() => this._chunkStep(), 0);
  },
  _cancelChunks(){ if (this._chunkTimer){ clearTimeout(this._chunkTimer); this._chunkTimer = null; } },
  // Dorysuj resztę od razu — potrzebne, zanim ktoś domaluje coś na wierzchu (timelapse, eksport),
  // inaczej te same odcinki trafiłyby na kanwę dwa razy i rozjaśniły się.
  _finishChunks(){
    if (this._chunkTimer == null || this._pusto()) return;
    this._cancelChunks();
    const ctx = this._offCtx, s = this._scale || 1;
    ctx.setTransform(s,0,0,s,0,0);
    this._paint(ctx, null, this._chunkAt, 0, this._view);   // count 0 = do końca
    this._chunkAt = -1;
  },
  // Rysuje ślad w układzie px logicznych — ctx musi mieć już ustawioną skalę.
  // Wydzielone z _redraw, bo eksport PNG rysuje tym samym kodem na własnej kanwie.
  // `after` (opcjonalne) ogranicza rysowanie do odcinków późniejszych niż podany czas.
  // `from`/`count` służą rysowaniu na raty: zwraca indeks, od którego wznowić, albo -1 gdy koniec.
  // `view` (zamrożony układ odniesienia) podają wszystkie rysowania na kanwę ekranową;
  // eksport PNG go pomija i liczy własny, bo rysuje jednym przebiegiem.
  _paint(ctx, after, from, count, view){
    const segs = this._segments;
    if (!segs.length) return -1;

    const v = view || this._viewParams();
    const minLat=v.minLat, maxLat=v.maxLat, minLng=v.minLng, maxLng=v.maxLng;

    ctx.globalCompositeOperation = this.options.additive ? 'lighter' : 'source-over';
    ctx.lineWidth = this.options.weight;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    const cbm = this._colorByMode, F = this._filter;
    if (!cbm) ctx.strokeStyle = this._single;

    // piksel kontenera = rzut(zoom 0) * 2^zoom - początek układu warstwy
    const k = v.k, ox = v.ox, oy = v.oy;
    const delta = after != null;
    let i = from > 0 ? from : 0;
    const stop = count > 0 ? Math.min(segs.length, i + count) : segs.length;
    for (; i < stop; i++){
      const seg = segs[i];
      if (this._hideDup && seg.dup) continue;      // prosta powielająca narysowany obok gęsty ślad
      if (delta && !(Number.isFinite(seg.t) && seg.t > after)) continue;   // reszta już jest na kanwie
      if (F){
        if (Number.isFinite(seg.t) && (seg.t < F.from || seg.t > F.to)) continue;
        if (F.modes && !F.modes.has(seg.mode)) continue;
      }
      const sb = seg.b;
      if (sb[2] < minLat || sb[0] > maxLat || sb[3] < minLng || sb[1] > maxLng) continue;
      if (cbm) ctx.strokeStyle = this._modeStyle[seg.mode] || this._modeStyle.unknown;
      // zaokrąglenie jak w latLngToContainerPoint Leafletu — bez niego ślad rysowałby się
      // na ułamkach piksela i wyglądałby inaczej (miększe wygładzanie, słabszy blask)
      const p = seg.p0 || this._project(seg);
      ctx.beginPath();
      ctx.moveTo(Math.round(p[0]*k) - ox, Math.round(p[1]*k) - oy);
      for (let j = 2; j < p.length; j += 2)
        ctx.lineTo(Math.round(p[j]*k) - ox, Math.round(p[j+1]*k) - oy);
      ctx.stroke();
    }
    return i < segs.length ? i : -1;
  }
});

function hexToRgba(hex, a){
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

const heat = new L.HeatLines([]).addTo(map);

// ---------- Odwiedzone kraje (granice z CDN, wykrywanie w pełni lokalnie) ----------
map.createPane('countries');
map.getPane('countries').style.zIndex = 250;          // nad kafelkami (200), pod śladem (400)
map.getPane('countries').style.pointerEvents = 'none';
// Granice Natural Earth 50m — dokładniejsze niż 110m (mniej błędów przy granicach, np. PL/UA)
const COUNTRY_URL = 'https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@master/geojson/ne_50m_admin_0_countries.geojson';
let COUNTRY_GJ = null;          // surowy GeoJSON do warstwy
let COUNTRIES = null;          // [{key, parts:[{poly, bbox:[minLng,minLat,maxLng,maxLat]}]}]
let countryLayer = null, countryShow = false, countryLoading = null;
const VISITED_CC = new Set();  // klucze odwiedzonych krajów
let VISITED_LIST = [];         // [{key, name, km2, bbox:[minLat,minLng,maxLat,maxLng]}] — malejąco wg obszaru
const CC_CACHE = new Map();    // rejon 0,05° -> klucz kraju | null (pamięć podręczna PIP)
const CC_MIN = 2;              // min. liczba rejonów (~5 km) z ruchu naziemnego, by uznać kraj za odwiedzony
// klucz identyfikujący kraj (nazwa administracyjna — zawsze unikalna, bez problemu kodów ISO „-99")
function ccKey(feat){ const p = feat.properties || {}; return p.ADMIN || p.NAME || p.NAME_LONG || p.SOVEREIGNT || feat.id || '?'; }
// Natural Earth niesie nazwy w wielu językach. Trzymamy obie i wybieramy dopiero przy
// wyświetlaniu — inaczej przełączenie języka zostawiłoby listę krajów w poprzednim.
function ccNames(feat){
  const p = feat.properties || {}, en = p.NAME_EN || p.NAME || ccKey(feat);
  return { pl: p.NAME_PL || en, en };
}
function ccLabel(c){ return (c.names && c.names[LANG]) || (c.names && c.names.en) || c.key; }

function pointInRing(lng, lat, ring){
  let inside = false;
  for (let i=0, j=ring.length-1; i<ring.length; j=i++){
    const xi=ring[i][0], yi=ring[i][1], xj=ring[j][0], yj=ring[j][1];
    if (((yi>lat)!==(yj>lat)) && (lng < (xj-xi)*(lat-yi)/(yj-yi)+xi)) inside = !inside;
  }
  return inside;
}
function countryAt(lat, lng){
  if (!COUNTRIES) return null;
  for (const c of COUNTRIES){
    for (const part of c.parts){
      const b = part.bbox;                       // bbox pojedynczej części (metropolia osobno od terytoriów zamorskich)
      if (lng < b[0] || lng > b[2] || lat < b[1] || lat > b[3]) continue;
      const poly = part.poly;
      if (!pointInRing(lng, lat, poly[0])) continue;
      let hole = false;
      for (let h=1; h<poly.length; h++){ if (pointInRing(lng, lat, poly[h])){ hole = true; break; } }
      if (!hole) return c.key;
    }
  }
  return null;
}
function loadCountries(){
  if (COUNTRIES) return Promise.resolve();
  if (countryLoading) return countryLoading;
  countryLoading = fetch(COUNTRY_URL).then(r => r.json()).then(gj => {
    COUNTRY_GJ = gj; COUNTRIES = [];
    for (const feat of gj.features){
      const g = feat.geometry; if (!g) continue;
      const polys = g.type==='Polygon' ? [g.coordinates] : g.type==='MultiPolygon' ? g.coordinates : [];
      const parts = [];
      for (const poly of polys){
        let miLng=Infinity,miLat=Infinity,maLng=-Infinity,maLat=-Infinity;
        for (const pt of poly[0]){
          if(pt[0]<miLng)miLng=pt[0]; if(pt[0]>maLng)maLng=pt[0];
          if(pt[1]<miLat)miLat=pt[1]; if(pt[1]>maLat)maLat=pt[1];
        }
        parts.push({ poly, bbox:[miLng,miLat,maLng,maLat] });
      }
      COUNTRIES.push({ key: ccKey(feat), names: ccNames(feat), parts });
    }
  }).catch(e => { console.error('Country borders — download failed:', e); countryLoading = null; throw e; });
  return countryLoading;
}
function detectCountries(cellSet){
  VISITED_CC.clear(); VISITED_LIST = [];
  if (!COUNTRIES) return;
  const acc = new Map();   // klucz kraju -> {n, km2, bbox}
  for (const key of cellSet){
    let code = CC_CACHE.get(key);
    const us = key.indexOf('_');
    const lat = parseInt(key.slice(0,us),10) * 0.05, lng = parseInt(key.slice(us+1),10) * 0.05;
    if (code === undefined){
      code = countryAt(lat, lng);
      CC_CACHE.set(key, code);
    }
    if (!code) continue;
    let a = acc.get(code);
    if (!a){ a = { n:0, km2:0, bbox:[lat,lng,lat,lng] }; acc.set(code, a); }
    a.n++;
    a.km2 += (0.05*111.32) * (0.05*111.32*Math.cos(lat*Math.PI/180));
    const b = a.bbox;
    if (lat<b[0])b[0]=lat; if (lng<b[1])b[1]=lng; if (lat>b[2])b[2]=lat; if (lng>b[3])b[3]=lng;
  }
  const namesOf = new Map(COUNTRIES.map(c => [c.key, c.names]));
  for (const [code, a] of acc){
    if (a.n < CC_MIN) continue;                       // odfiltruj pojedyncze rejony przy granicy
    VISITED_CC.add(code);
    VISITED_LIST.push({ key:code, names: namesOf.get(code), km2:a.km2, bbox:a.bbox });
  }
  VISITED_LIST.sort((x,y) => y.km2 - x.km2);
}
function renderCountryList(){
  const host = document.getElementById('countryList'); if (!host) return;
  host.innerHTML = '';
  document.getElementById('ccCount').textContent = VISITED_LIST.length ? t('cc.count', VISITED_LIST.length) : '';
  if (!VISITED_LIST.length){

// ---------- Model danych ----------
/*<<CORE*/
// Segment = { c:Float32Array[lat,lng,...], b:[minLat,minLng,maxLat,maxLng], t:startMs, mode, gd:dystansKm }
let SEGMENTS = [];
let ACTIVITIES = [];   // {t, te, mode, dist(m)}  — do statystyk i przypisania trybu trasom
let VISITS = [];       // {t, type: 'home'|'work'|'other'}
let PATHREFS = [];     // referencje do segmentów-tras czekających na przypisanie trybu
let TOTAL_PTS = 0, FILES = 0;
let DEMO = false;      // czy na mapie leżą dane przykładowe, a nie wczytane przez użytkownika
const FORMATS = new Set();
let DATA_MIN = null, DATA_MAX = null;   // ms (początek/koniec doby)

function haversine(a1,o1,a2,o2){
  const R=6371, r=Math.PI/180;
  const dLa=(a2-a1)*r, dLn=(o2-o1)*r;
  const s = Math.sin(dLa/2)**2 + Math.cos(a1*r)*Math.cos(a2*r)*Math.sin(dLn/2)**2;
  return 2*R*Math.asin(Math.min(1, Math.sqrt(s)));
}
// Wykrywa "podejrzane" aktywności ze starych eksportów Google Timeline: deklarowany dystans
// jest rzędu tysięcy km, a zarejestrowane punkty start/koniec leżą w tym samym miejscu
// (znany błąd danych, głównie przy lotach 2015/2016) — takie rekordy pomijamy w statystykach.
function isSuspiciousDistance(distM, sp, ep){
  if (!sp || !ep || !(distM > 0)) return false;
  const straightKm = haversine(sp[0],sp[1], ep[0],ep[1]);
  const distKm = distM/1000;
  return distKm > 200 && straightKm < 50 && distKm > straightKm*10;
}
// Otoczka wypukła (Andrew's monotone chain); punkty [lat,lng], x=lng, y=lat
function convexHull(pts){
  if (pts.length < 3) return pts.slice();
  const P = pts.slice().sort((a,b) => a[1]-b[1] || a[0]-b[0]);
  const cross = (o,a,b) => (a[1]-o[1])*(b[0]-o[0]) - (a[0]-o[0])*(b[1]-o[1]);
  const lower = [];
  for (const p of P){ while (lower.length>=2 && cross(lower[lower.length-2],lower[lower.length-1],p)<=0) lower.pop(); lower.push(p); }
  const upper = [];
  for (let i=P.length-1;i>=0;i--){ const p=P[i]; while (upper.length>=2 && cross(upper[upper.length-2],upper[upper.length-1],p)<=0) upper.pop(); upper.push(p); }
  lower.pop(); upper.pop();
  return lower.concat(upper);
}
// Najdalsza para (średnica) — punkty skrajne zawsze leżą na otoczce
function farthestPair(hull){
  let best = 0, ai = -1, bi = -1;
  for (let i=0;i<hull.length;i++)
    for (let j=i+1;j<hull.length;j++){
      const d = haversine(hull[i][0],hull[i][1],hull[j][0],hull[j][1]);
      if (d > best){ best = d; ai = i; bi = j; }
    }
  return { km:best, a: ai>=0?hull[ai]:null, b: bi>=0?hull[bi]:null };
}

function makeSegment(pts, t, mode, te){ // pts: [[lat,lng],...]
  if (pts.length < 2) return null;
  const c = new Float32Array(pts.length * 2);
  let minLat=Infinity,minLng=Infinity,maxLat=-Infinity,maxLng=-Infinity, gd=0;
  for (let i=0;i<pts.length;i++){
    const la=pts[i][0], ln=pts[i][1];
    c[i*2]=la; c[i*2+1]=ln;
    if(la<minLat)minLat=la; if(la>maxLat)maxLat=la;
    if(ln<minLng)minLng=ln; if(ln>maxLng)maxLng=ln;
    if(i) gd += haversine(pts[i-1][0], pts[i-1][1], la, ln);
  }
  const t0 = Number.isFinite(t) ? t : NaN;
  const teN = Number.isFinite(te) ? te : t0;   // czas zakończenia — potrzebny do łączenia sąsiednich podróży
  return { c, b:[minLat,minLng,maxLat,maxLng], t: t0, te: teN, mode: mode||'unknown', gd };
}
function pushSeg(pts, t, mode, te){
  const s = makeSegment(pts, t, mode, te);
  if (s){ SEGMENTS.push(s); TOTAL_PTS += pts.length; return s; }
  return null;
}

// ---------- Parsery ----------
function valid(la, ln){
  return Number.isFinite(la) && Number.isFinite(ln) &&
         la>=-90 && la<=90 && ln>=-180 && ln<=180 && !(la===0 && ln===0);
}
function parseLatLngStr(s){
  if (typeof s !== 'string') return null;
  s = s.replace(/geo:/i,'').replace(/°/g,'').trim();
  const m = s.split(',');
  if (m.length < 2) return null;
  const la = parseFloat(m[0]), ln = parseFloat(m[1]);
  return valid(la, ln) ? [la, ln] : null;
}
function e7(v){ return (typeof v === 'number') ? v/1e7 : NaN; }
function tms(s){ const t = s ? Date.parse(s) : NaN; return Number.isFinite(t) ? t : NaN; }

// Zwraca true, gdy kształt pliku został rozpoznany. Bez tego nie da się odróżnić
// „to nie jest eksport Google" od „to jest eksport, ale nie ma w nim tras".
function parseAny(obj){
  if (Array.isArray(obj)){ FORMATS.add('fmt.phone'); parseNewSegments(obj); return true; }
  if (obj && Array.isArray(obj.semanticSegments)){
    FORMATS.add('fmt.phone');
    parseNewSegments(obj.semanticSegments);
    if (Array.isArray(obj.rawSignals)) parseRawSignals(obj.rawSignals);
    return true;
  }
  if (obj && Array.isArray(obj.locations)){ FORMATS.add('fmt.records'); parseRecords(obj.locations); return true; }
  if (obj && Array.isArray(obj.timelineObjects)){ FORMATS.add('fmt.semantic'); parseSemantic(obj.timelineObjects); return true; }
  if (obj && Array.isArray(obj.timelineEdits)){ FORMATS.add('fmt.edits'); parseTimelineEdits(obj.timelineEdits); return true; }
  if (obj && Array.isArray(obj.timelinePath)){ FORMATS.add('fmt.phone'); parseNewSegments([obj]); return true; }
  return false;
}

// Diagnostyka wczytywania — zbierana i w wątku roboczym, i na ścieżce awaryjnej,
// żeby po nieudanym wczytaniu powiedzieć, co było w plikach, a nie tylko „nie znaleziono tras".
let DIAG = null;
function diagReset(){ DIAG = { obce:[], zleJson:[], nieznane:[], puste:[], ok:0, jsonow:0 }; }
function diagPlik(nazwa, txt){
  DIAG.jsonow++;
  let obj;
  try { obj = JSON.parse(txt); }
  catch (e){ if (DIAG.zleJson.length < 5) DIAG.zleJson.push(nazwa); return; }
  if (parseAny(obj)) DIAG.ok++;
  else if (DIAG.nieznane.length < 5)
    DIAG.nieznane.push(nazwa + ' [' + (obj && typeof obj === 'object'
      ? Object.keys(obj).slice(0,4).join(', ') || 'pusty obiekt'
      : typeof obj) + ']');
}

// Nowy format telefonowy: segmenty timelinePath / activity / visit
function parseNewSegments(arr){
  for (const seg of arr){
    if (!seg) continue;
    const t0 = tms(seg.startTime), t1 = tms(seg.endTime);
    if (Array.isArray(seg.timelinePath) && seg.timelinePath.length){
      const pts = [];
      for (const p of seg.timelinePath){
        const ll = parseLatLngStr(p.point || p.latLng || p.location);
        if (ll) pts.push(ll);
      }
      const s = pushSeg(pts, t0, 'unknown', t1);
      if (s) PATHREFS.push(s);
    } else if (seg.activity){
      const a = seg.activity;
      const dist = +(a.distanceMeters) || 0;
      const mode = refineMode(activityToMode(a.topCandidate && a.topCandidate.type), dist, t0, t1);
      const s = parseLatLngStr(a.start && (a.start.latLng || a.start));
      const e = parseLatLngStr(a.end   && (a.end.latLng   || a.end));
      if (!isSuspiciousDistance(dist, s, e)) ACTIVITIES.push({ t:t0, te:Number.isFinite(t1)?t1:t0, mode, dist });
      if (s && e) pushSeg([s, e], t0, mode, t1);   // prosta linia — geometria wypełniana przez timelinePath
    } else if (seg.visit){
      const st = seg.visit.topCandidate && seg.visit.topCandidate.semanticType;
      const type = /HOME/i.test(st||'') ? 'home' : /WORK/i.test(st||'') ? 'work' : 'other';
      VISITS.push({ t:t0, type });
    }
  }
}
function parseRawSignals(arr){
  const pts = [];
  for (const r of arr){
    const pos = r.position || r;
    const ll = parseLatLngStr(pos && (pos.LatLng || pos.latLng || pos.point));
    const t  = pos && (pos.timestamp || pos.time);
    if (ll) pts.push({ ll, t: t ? Date.parse(t) : NaN });
  }
  connectByTime(pts);
}
function parseTimelineEdits(arr){
  const pts = [];
  for (const e of arr){
    const pos = e && e.rawSignal && e.rawSignal.signal && e.rawSignal.signal.position;
    if (!pos || !pos.point) continue;
    const la = e7(pos.point.latE7), ln = e7(pos.point.lngE7);
    if (!valid(la, ln)) continue;
    pts.push({ ll:[la, ln], t: pos.timestamp ? Date.parse(pos.timestamp) : NaN });
  }
  connectByTime(pts);
}
function parseRecords(locs){
  const pts = [];
  for (const l of locs){
    let la, ln;
    if (typeof l.latitudeE7 === 'number'){ la = e7(l.latitudeE7); ln = e7(l.longitudeE7); }
    else if (typeof l.latE7 === 'number'){ la = e7(l.latE7); ln = e7(l.lngE7); }
    if (!valid(la, ln)) continue;
    let t = NaN;
    if (l.timestamp) t = Date.parse(l.timestamp);
    else if (l.timestampMs) t = +l.timestampMs;
    pts.push({ ll:[la, ln], t });
  }
  connectByTime(pts);
}
// Łączy punkty w polilinie, dzieląc gdy przerwa > 10 min lub skok > 20 km
function connectByTime(pts){
  pts = pts.filter(p => Number.isFinite(p.t)).sort((a,b) => a.t - b.t);
  if (pts.length < 2) return;
  const GAP = 10*60*1000, JUMP = 20;
  let run = [pts[0].ll], t0 = pts[0].t, te = pts[0].t;
  for (let i=1;i<pts.length;i++){
    const dt = pts[i].t - pts[i-1].t;
    const dd = haversine(pts[i-1].ll[0], pts[i-1].ll[1], pts[i].ll[0], pts[i].ll[1]);
    if (dt > GAP || dd > JUMP){ pushSeg(run, t0, 'unknown', te); run = []; t0 = pts[i].t; }
    run.push(pts[i].ll); te = pts[i].t;
  }
  pushSeg(run, t0, 'unknown', te);
}
// Takeout Semantic — activitySegment z gotowym trybem i geometrią
function parseSemantic(objs){
  for (const o of objs){
    if (o.placeVisit){
      const st = o.placeVisit.location && o.placeVisit.location.semanticType;
      VISITS.push({ t: tms(o.placeVisit.duration && o.placeVisit.duration.startTimestamp),
                    type: /HOME/i.test(st||'')?'home':/WORK/i.test(st||'')?'work':'other' });
      continue;
    }
    const as = o.activitySegment;
    if (!as) continue;
    let mode = activityToMode(as.activityType);
    const t0 = tms(as.duration && as.duration.startTimestamp);
    let pts = null;
    if (as.simplifiedRawPath && Array.isArray(as.simplifiedRawPath.points)){
      pts = as.simplifiedRawPath.points.map(p => [e7(p.latE7), e7(p.lngE7)]).filter(x => valid(x[0],x[1]));
    } else if (as.waypointPath && Array.isArray(as.waypointPath.waypoints)){
      pts = as.waypointPath.waypoints.map(p => [e7(p.latE7), e7(p.lngE7)]).filter(x => valid(x[0],x[1]));
    } else if (as.startLocation && as.endLocation){
      const s = [e7(as.startLocation.latitudeE7), e7(as.startLocation.longitudeE7)];
      const e = [e7(as.endLocation.latitudeE7),   e7(as.endLocation.longitudeE7)];
      if (valid(s[0],s[1]) && valid(e[0],e[1])) pts = [s, e];
    }
    if (pts && pts.length >= 2){
      const t1 = tms(as.duration && as.duration.endTimestamp);
      const dist = typeof as.distance === 'number' ? as.distance
                 : pts.reduce((d,_,i)=> i? d+haversine(pts[i-1][0],pts[i-1][1],pts[i][0],pts[i][1])*1000 : 0, 0);
      mode = refineMode(mode, dist, t0, t1);
      pushSeg(pts, t0, mode, t1);
      if (!isSuspiciousDistance(dist, pts[0], pts[pts.length-1])) ACTIVITIES.push({ t:t0, te:t1, mode, dist });
    }
  }
}

// Po wczytaniu: przypisz trybom trasom timelinePath tryb z nakładających się aktywności
function resolveModes(){
  if (!PATHREFS.length || !ACTIVITIES.length) return;
  const acts = ACTIVITIES.filter(a => Number.isFinite(a.t)).sort((a,b)=>a.t-b.t);
  const starts = acts.map(a => a.t);
  const lowerBound = (t) => { let lo=0, hi=starts.length; while(lo<hi){ const m=(lo+hi)>>1; if(starts[m]<t) lo=m+1; else hi=m; } return lo; };
  for (const seg of PATHREFS){
    const t0 = seg.t, t1 = Number.isFinite(seg.te) ? seg.te : seg.t;
    if (!Number.isFinite(t0)) continue;
    // szukamy aktywności o największym nakładaniu czasowym
    let bestMode = 'unknown', bestOv = 0;
    let i = Math.max(0, lowerBound(t0) - 4);
    for (; i < acts.length; i++){
      const a = acts[i];
      if (a.t > t1) break;
      const ov = Math.min(t1, a.te) - Math.max(t0, a.t);
      if (ov > bestOv){ bestOv = ov; bestMode = a.mode; }
    }
    if (bestOv > 0) seg.mode = bestMode;
  }
}

// Prekalkulacje robione po sparsowaniu. Wydzielone, bo wątek roboczy liczy je u siebie —
// dzięki temu wątek główny dostaje dane gotowe do rysowania i nic już nie liczy.
function computeHulls(){
  for (const s of SEGMENTS){
    const pts = [];
    for (let i=0;i<s.c.length;i+=2) pts.push([s.c[i], s.c[i+1]]);
    s.hull = convexHull(pts);
  }
}
function computeRange(){
  let mn=Infinity, mx=-Infinity;
  for (const s of SEGMENTS){ if (Number.isFinite(s.t)){ if(s.t<mn)mn=s.t; if(s.t>mx)mx=s.t; } }
  if (Number.isFinite(mn)){ DATA_MIN = dayStart(mn); DATA_MAX = dayStart(mx); }
  else { DATA_MIN = DATA_MAX = null; }
}
function dayStart(ms){ const d = new Date(ms); d.setHours(0,0,0,0); return d.getTime(); }
/*CORE>>*/

// ---------- Dane przykładowe ----------
// Generowane w locie, a nie doklejone jako plik: aplikacja ma zostać jednym plikiem HTML,
// a zestaw gęsty na tyle, żeby heatmapa wyglądała jak prawdziwa, ważyłby kilka megabajtów.
// Generator jest deterministyczny (własny PRNG), więc każdy widzi dokładnie ten sam przykład.
// To dane WYMYŚLONE — nie czyjaś prawdziwa historia lokalizacji.
function buildDemo(){
  let s = 20260801 >>> 0;
  const rnd = () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; };
  const gauss = () => (rnd() + rnd() + rnd() - 1.5) / 1.5;

  const HOME = [52.5200, 13.4050];                       // Berlin — punkt odniesienia przykładu
  const LATK = 111.32, LNGK = 111.32 * Math.cos(HOME[0] * Math.PI/180);
  const dLat = m => m / 1000 / LATK, dLng = m => m / 1000 / LNGK;
  const toLL = (xkm, ykm) => [HOME[0] + ykm/LATK, HOME[1] + xkm/LNGK];

  // Sieć ulic: przesunięta losowo siatka, więc nic nie jest idealnie proste ani równoległe.
  // Regularna siatka z routingiem „najpierw w bok, potem w pion" składa się w prostokąty,
  // a wyznaczanie zawsze najkrótszej trasy upycha wszystkie przejazdy na kilkunastu
  // krawędziach — w obu przypadkach wychodzi rysunek techniczny, nie miasto.
  const G = 19, SPACING = 0.62;                    // km między węzłami
  const W = [];
  for (let i = 0; i < G; i++)
    for (let j = 0; j < G; j++){
      // Siatka rozciągana od środka: w centrum ulice gęściej, na obrzeżach rzadziej,
      // plus spore przesunięcie każdego węzła. Równe odstępy od razu zdradzają kratę.
      const u = (j-(G-1)/2)/((G-1)/2), v = (i-(G-1)/2)/((G-1)/2);
      const rozciag = q => Math.sign(q) * Math.pow(Math.abs(q), 1.35);
      W.push({ x: rozciag(u)*SPACING*(G-1)/2 + gauss()*SPACING*0.46,
               y: rozciag(v)*SPACING*(G-1)/2 + gauss()*SPACING*0.46 });
    }
  const n = W.length, idx = (i,j) => i*G + j;
  const odl = (a, b) => Math.hypot(W[a].x-W[b].x, W[a].y-W[b].y);

  const SAS = Array.from({length:n}, () => []);
  const krawedz = (a, b) => { if (!SAS[a].includes(b)){ SAS[a].push(b); SAS[b].push(a); } };
  for (let i = 0; i < G; i++)
    for (let j = 0; j < G; j++){
      // Część połączeń wycięta: pełna krata wygląda jak papier milimetrowy, a prawdziwe
      // ulice się urywają, zakręcają i nie każda przecznica jest przejezdna.
      if (j+1 < G && rnd() < 0.72) krawedz(idx(i,j), idx(i,j+1));
      if (i+1 < G && rnd() < 0.72) krawedz(idx(i,j), idx(i+1,j));
      if (i+1 < G && j+1 < G && rnd() < 0.26) krawedz(idx(i,j), idx(i+1,j+1));
      if (i+1 < G && j > 0   && rnd() < 0.26) krawedz(idx(i,j), idx(i+1,j-1));
    }
  // Węzły odcięte od reszty zepsułyby trasę — dopnij każdy do najbliższego sąsiada.
  for (let a = 0; a < n; a++){
    if (SAS[a].length) continue;
    let best = -1, bd = Infinity;
    for (let b = 0; b < n; b++){ if (b === a) continue; const d = odl(a,b); if (d < bd){ bd = d; best = b; } }
    if (best >= 0) krawedz(a, best);
  }

  // Wybór trasy zachłanny, ale z szumem: kolejne przejazdy tą samą relacją idą trochę innymi
  // ulicami, tak jak w rzeczywistości. Dzięki temu powstaje pajęczyna z jasnymi korytarzami,
  // a nie kilka wypalonych kresek.
  const trasa = (a, b) => {
    const pts = [];
    let u = a, prev = -1, guard = 0;
    const dodaj = (od, doo) => {
      const kroki = Math.max(1, Math.round(odl(od, doo)*1000/150));
      for (let q = 0; q < kroki; q++){
        const f = q/kroki;
        const p = toLL(W[od].x + (W[doo].x-W[od].x)*f, W[od].y + (W[doo].y-W[od].y)*f);
        pts.push([p[0] + dLat(gauss()*10), p[1] + dLng(gauss()*10)]);
      }
    };
    while (u !== b && guard++ < 400){
      let best = -1, bs = Infinity;
      for (const v of SAS[u]){
        if (v === prev && SAS[u].length > 1) continue;      // nie zawracaj od razu
        const s = Math.hypot(W[v].x-W[b].x, W[v].y-W[b].y) * (0.82 + rnd()*0.55);
        if (s < bs){ bs = s; best = v; }
      }
      if (best < 0) break;
      dodaj(u, best);
      prev = u; u = best;
    }
    const p = toLL(W[b].x, W[b].y);
    pts.push([p[0] + dLat(gauss()*10), p[1] + dLng(gauss()*10)]);
    return pts;
  };

  const DAY = 86400000;
  const START = Date.UTC(2023, 0, 2);
  const trip = (pts, t, mode, durMin) => {
    if (pts.length < 2) return;
    const te = t + durMin*60000;
    const seg = pushSeg(pts, t, mode, te);
    if (seg) ACTIVITIES.push({ t, te, mode, dist: seg.gd*1000 });
  };
  const modeFor = km => km < 1.2 ? 'walk' : km < 4 ? (rnd() < 0.45 ? 'bike' : 'transit')
                                                   : (rnd() < 0.7 ? 'car' : 'transit');
  const dist = pts => { let d = 0; for (let i=1;i<pts.length;i++)
    d += haversine(pts[i-1][0], pts[i-1][1], pts[i][0], pts[i][1]); return d; };

  const DOM = idx(11, 8), PRACA = idx(6, 13);
  // Kilka miejsc odwiedzanych stale (praca, szkoła, sklepy) plus szeroki ogon miejsc
  // przypadkowych — bez tego ogona mapa ma korytarze, ale nie ma tkanki miasta.
  const stale = [idx(12,12), idx(9,4), idx(14,9), idx(7,7), idx(10,15), idx(4,10)];
  const cele = [];
  for (let k = 0; k < 40; k++) cele.push(Math.floor(rnd()*n));

  for (let d = 0; d < 960; d++){
    const t0 = START + d*DAY;
    const dzien = new Date(t0).getUTCDay();
    const robocz = dzien >= 1 && dzien <= 5;
    VISITS.push({ t: t0 + 7*3600000, type: 'home' });
    if (robocz && rnd() < 0.88){
      const rano = t0 + (7 + rnd()*1.5)*3600000;
      const tam = trasa(DOM, PRACA);
      const km = dist(tam);
      trip(tam, rano, modeFor(km), 12 + km*3);
      VISITS.push({ t: rano + 3600000, type: 'work' });
      const wieczor = t0 + (16.5 + rnd()*2)*3600000;
      trip(trasa(PRACA, DOM), wieczor, modeFor(km), 12 + km*3);
    }
    const sprawunki = robocz ? (rnd() < 0.55 ? 1 : 0) : 1 + Math.floor(rnd()*3);
    for (let k = 0; k < sprawunki; k++){
      // dwa razy częściej miejsce „swoje" niż przypadkowe — tak wygląda czyjś rozkład wyjść
      const cel = rnd() < 0.55 ? stale[Math.floor(rnd()*stale.length)]
                               : cele[Math.floor(rnd()*cele.length)];
      const t1 = t0 + (10 + rnd()*9)*3600000;
      const tam = trasa(DOM, cel), km = dist(tam);
      trip(tam, t1, modeFor(km), 10 + km*4);
      trip(trasa(cel, DOM), t1 + (1 + rnd()*2)*3600000, modeFor(km), 10 + km*4);
    }
  }

  // Wyjazdy — pokazują listę odwiedzonych krajów i różnicę między jazdą a lotem
  const WYJAZDY = [
    { cel:[52.3700, 4.9000],  mode:'car',     razy:3 },   // Amsterdam
    { cel:[50.0800, 14.4400], mode:'car',     razy:4 },   // Praga
    { cel:[48.2100, 16.3700], mode:'transit', razy:3 },   // Wiedeń
    { cel:[55.6800, 12.5700], mode:'car',     razy:2 },   // Kopenhaga
    { cel:[48.8600, 2.3500],  mode:'transit', razy:2 },   // Paryż
    { cel:[41.3900, 2.1700],  mode:'flight',  razy:2 },   // Barcelona
    { cel:[41.9000, 12.5000], mode:'flight',  razy:2 },   // Rzym
  ];
  for (const w of WYJAZDY){
    for (let r = 0; r < w.razy; r++){
      const t1 = START + (60 + Math.floor(rnd()*860))*DAY + 8*3600000;
      // Lot leci prosto, jazda wije się jak droga: łuk w bok plus drobne falowanie,
      // żeby wyjazdy nie wyglądały jak promienie wystrzelone z jednego punktu.
      const kroki = w.mode === 'flight' ? 14 : 90;
      const luk = w.mode === 'flight' ? 0 : 0.10 + rnd()*0.10;
      const znak = rnd() < 0.5 ? -1 : 1;
      const start = toLL(W[DOM].x, W[DOM].y);
      const buduj = (od, dokad) => {
        const pts = [];
        const dy = dokad[0]-od[0], dx = dokad[1]-od[1];
        for (let q = 0; q <= kroki; q++){
          const f = q/kroki, wyg = Math.sin(f*Math.PI)*luk*znak;
          const fal = Math.sin(f*Math.PI*7)*luk*0.18;
          pts.push([ od[0] + dy*f - (wyg+fal)*dx*0.5 + gauss()*0.004,
                     od[1] + dx*f + (wyg+fal)*dy*0.5 + gauss()*0.004 ]);
        }
        return pts;
      };
      const tam = buduj(start, w.cel);
      const godz = w.mode === 'flight' ? 2.2 : dist(tam)/85;
      trip(tam, t1, w.mode, godz*60);
      // kilka krótkich tras na miejscu, żeby kraj miał realny zasięg, a nie jeden punkt
      const cLat = w.cel[0], cLng = w.cel[1];
      const cLngK = 111.32 * Math.cos(cLat*Math.PI/180);
      for (let k = 0; k < 14; k++){
        const p0 = [cLat + (rnd()-0.5)*0.05, cLng + (rnd()-0.5)*0.07];
        const pts = [p0];
        for (let q = 0; q < 9; q++){
          const last = pts[pts.length-1];
          pts.push([ last[0] + (rnd()-0.5)*0.7/LATK, last[1] + (rnd()-0.5)*0.7/cLngK ]);
        }
        const tk = t1 + (6 + k*1.3 + rnd())*3600000;
        trip(pts, tk, rnd() < 0.5 ? 'walk' : 'transit', 20 + rnd()*30);
        VISITS.push({ t: tk, type: 'other' });
      }
      const powrot = buduj(w.cel, start);
      trip(powrot, t1 + (2 + Math.floor(rnd()*4))*DAY, w.mode, godz*60);
    }
  }
  FORMATS.add('demo.format');
}
